  .langbar button{font-family:var(--sans);font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);
    background:var(--panel);color:var(--ink-soft);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .langbar button.on{background:var(--garnet);border-color:var(--garnet);color:#fff}

  .dot{width:22px;height:5px;border-radius:3px;background:var(--line-strong);transition:.3s}
  .dot.done{background:var(--teal)} .dot.cur{background:var(--garnet)}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 0 30px;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .art{width:118px;height:118px;margin:0 auto 12px}

  .cta:hover{background:#7d1c30} .cta:disabled{background:var(--line-strong);cursor:default}
  .center{text-align:center}
  .big{font-family:var(--serif);font-size:clamp(26px,6.5vw,38px);font-weight:700;letter-spacing:1px}
  .big .sev{color:var(--garnet)}

  .stars{font-size:32px;letter-spacing:5px;margin:12px 0}

  .learned{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:18px;text-align:left}
  .learned li{font-size:14.5px;color:var(--ink-soft);margin-bottom:8px;list-style:none;padding-left:24px;position:relative;line-height:1.6}

  .twnote{font-size:12px;color:var(--ink-faint);text-align:center;padding:8px 6px 0;line-height:1.6}
  .foot{text-align:center;color:var(--ink-faint);font-size:11.5px;padding:10px 0 24px}
</style>

var LANGS=[["zh","🇹🇼 國語"],["nan","🇹🇼 台語"],["en","🇬🇧 English"],["vi","🇻🇳 Tiếng Việt"],["id","🇮🇩 Bahasa"]];
var SPEECH={zh:"zh-TW",nan:"zh-TW",en:"en-US",vi:"vi-VN",id:"id-ID"};
var ROLE_VAL=["病人本人","家屬","陪病者／看護"], AGE_VAL=["<40","40-64","65+"];

function getParam(k){try{return new URLSearchParams(location.search).get(k)}catch(e){return null}}
var URL_RID=getParam('rid'), SRC=getParam('src')||"direct", ENDPOINT="";
var RID=URL_RID||('r'+Date.now()+Math.random().toString(36).slice(2,8));
var LANGMAP={"zh-Hant":"zh","zh-Hans":"zh","zh":"zh","nan":"nan","en":"en","vi":"vi","id":"id","ja":"en","ko":"en","th":"en"};
var _ql=getParam('lang');
var lang=(_ql&&LANGMAP[_ql])?LANGMAP[_ql]:"zh", step=0, stars=0, currentSpeak="";
function blank(){return {response_id:RID,source:SRC,ts:new Date().toISOString(),
  instrument:"game",mode:"post",lang:lang,role:null,age:null,
  k1:null,k2:null,k3:null,k4:null,k5:null,misconception:null,
  act1:null,act2:null,self_efficacy:null,clarity:null,questions:[],stars:0};}
var data=blank();
function L(){return STR[lang]}
var VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
loadVoices();try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
var VPREF={zh:['zh-tw','zh-hk','zh-cn','zh'],nan:['zh-tw','zh'],en:['en-us','en-gb','en'],vi:['vi-vn','vi'],id:['id-id','id']};
function pickVoice(lg){var pref=VPREF[lg]||[lg];
  for(var i=0;i<pref.length;i++){for(var j=0;j<VOICES.length;j++){
    var vl=(VOICES[j].lang||'').toLowerCase().replace('_','-');
    if(vl.indexOf(pref[i])===0)return VOICES[j];}}return null;}
function speak(txt){try{window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance((txt||"").replace(/<[^>]+>/g,''));
  var v=pickVoice(lang);
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang=SPEECH[lang]||"zh-TW";}
  u.rate=0.95;u.pitch=1;
  window.speechSynthesis.speak(u);}catch(e){}}

function bag(color,label){return '<svg class="art" viewBox="0 0 120 120" fill="none"><rect x="34" y="24" width="52" height="72" rx="12" fill="'+color+'" opacity=".16"/><rect x="34" y="24" width="52" height="72" rx="12" stroke="'+color+'" stroke-width="3"/><rect x="50" y="14" width="20" height="14" rx="4" fill="'+color+'"/>'+(label?'<text x="60" y="70" text-anchor="middle" font-family="Noto Serif TC" font-size="26" font-weight="700" fill="'+color+'">'+label+'</text>':'')+'</svg>'}
function granny(){return '<div class="art" style="font-size:92px;line-height:118px">👵</div>'}
function trophy(){return '<svg class="badge" viewBox="0 0 120 120" fill="none"><circle cx="60" cy="52" r="34" fill="#F7E9EC" stroke="#96223A" stroke-width="3"/><text x="60" y="64" text-anchor="middle" font-family="Noto Serif TC" font-size="30" font-weight="700" fill="#96223A">7</text><path d="M44 88h32l-4 20H48z" fill="#96223A" opacity=".2" stroke="#96223A" stroke-width="2"/></svg>'}

var stageEl=document.getElementById('stage');
function renderDots(){var d=document.getElementById('dots'),h='';
  for(var i=1;i<=6;i++)h+='<span class="dot '+(step>i?'done':step===i?'cur':'')+'"></span>';d.innerHTML=h;}
function attachListen(){var b=stageEl.querySelector('.listen');if(b)b.onclick=function(){speak(currentSpeak)};}
function listenHTML(){return '<button class="listen">'+L().listen+'</button>'}

function showStart(){
  step=0;renderDots();currentSpeak=L().start_sub;
  stageEl.innerHTML='<div class="center">'+bag("#96223A","7")+
    '<h2 class="big">'+L().start_title+'</h2><p class="lead">'+L().start_sub+'</p>'+
    '<button class="cta" style="margin-top:24px" id="go">'+L().start_btn+'</button>'+
    (lang==="nan"&&L().tw_note?'<p class="twnote">'+L().tw_note+'</p>':'')+'</div>';
  document.getElementById('go').onclick=function(){step=1;renderStep()};
}
function choiceStage(cfg){
  currentSpeak=cfg.q;
  var h='<div class="scene">'+cfg.art+listenHTML()+'<h2 class="qt">'+cfg.q+'</h2>'+
    (cfg.scn?'<div class="scn">'+cfg.scn+'</div>':'')+'</div><div class="choices" id="ch"></div><div id="fbwrap"></div>';
  stageEl.innerHTML=h;attachListen();
  var ch=document.getElementById('ch');
  cfg.opts.forEach(function(o,i){
    var b=document.createElement('button');b.className='ch';
    b.innerHTML='<span class="ic">'+(cfg.icons?cfg.icons[i]:'')+'</span>'+o;
    b.onclick=function(){
      if(document.getElementById('fbwrap').innerHTML)return;
      cfg.record(i);
      ch.querySelectorAll('.ch').forEach(function(x,j){x.classList.add(j===cfg.correct?'right':(j===i?'wrong':'dim'));x.onclick=null;});
      if(i===cfg.correct)stars++;
      var warn=(cfg.warnWrong&&i!==cfg.correct);
      document.getElementById('fbwrap').innerHTML='<div class="fbk'+(warn?' warn':'')+'">'+cfg.fb+'</div><button class="cta" id="nx">▶</button>';
      document.getElementById('nx').onclick=function(){step++;renderStep()};
    };
    ch.appendChild(b);
  });
}
function tfStage(cfg){
  currentSpeak=cfg.q;
  stageEl.innerHTML='<div class="scene">'+bag("#A96A15","")+listenHTML()+'<h2 class="qt">'+cfg.q+'</h2></div>'+
    '<div class="tf" id="tf"><button data-v="true"><span class="em">🙆</span>'+L().tf_t+'</button>'+
    '<button data-v="false"><span class="em">🙅</span>'+L().tf_f+'</button></div><div id="fbwrap"></div>';
  attachListen();
  document.getElementById('tf').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      if(document.getElementById('fbwrap').innerHTML)return;
      var v=b.dataset.v,ok=(v===cfg.answer);cfg.record(v);
      b.classList.add(ok?'tRight':'tWrong');if(ok)stars++;
      document.getElementById('fbwrap').innerHTML='<div class="fbk warn">'+cfg.fb+'</div><button class="cta" id="nx">▶</button>';
      document.getElementById('nx').onclick=function(){step++;renderStep()};
    };
  });
}
function askStage(){
  var c=L();currentSpeak=c.a_q;
  stageEl.innerHTML='<div class="scene">'+bag("#96223A","")+listenHTML()+'<h2 class="qt">'+c.a_q+'</h2></div>'+
    '<div class="qcards" id="qc"></div><div id="conf"></div><div id="fbwrap"></div>'+
    '<button class="cta" id="qnext" disabled>▶</button>';
  attachListen();
  var qc=document.getElementById('qc'),picked=[];
  c.a_cards.forEach(function(t,i){
    var b=document.createElement('button');b.className='qcard';
    b.innerHTML='<span class="tick">✓</span>'+t;
    b.onclick=function(){var k=picked.indexOf(i);
      if(k>=0){picked.splice(k,1);b.classList.remove('pick')}else{picked.push(i);b.classList.add('pick')}
      data.questions=picked.slice();
      document.getElementById('qnext').disabled=picked.length===0;};
    qc.appendChild(b);
  });
  document.getElementById('qnext').onclick=function(){finishAsk(picked)};
}
function finishAsk(picked){
  var c=L();
  var good=picked.filter(function(i){return i<3}).length;
  data.act1=(good>=1&&picked.indexOf(3)<0)?'會':(picked.indexOf(3)>=0&&good===0?'不會':'也許');
  data.act2=(picked.indexOf(1)>=0)?'知道':'不知道';
  if(good>=1&&picked.indexOf(3)<0)stars++;
  document.getElementById('qc').style.pointerEvents='none';
  document.getElementById('qnext').style.display='none';
  document.getElementById('fbwrap').innerHTML='<div class="fbk">'+c.a_fb+'</div>';
  var faces=['😟','😕','🙂','😃'];
  document.getElementById('conf').innerHTML='<div class="scene" style="margin-top:22px"><h2 class="qt" style="font-size:19px">'+c.conf_q+'</h2></div><div class="faces" id="faces"></div>';
  var fe=document.getElementById('faces');
  faces.forEach(function(em,i){
    var b=document.createElement('button');b.className='face';
    b.innerHTML='<span class="em">'+em+'</span><span class="fl">'+c.conf_faces[i]+'</span>';
    b.onclick=function(){fe.querySelectorAll('.face').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');data.self_efficacy=i+1;
      if(!document.getElementById('toEnd')){var nb=document.createElement('button');nb.className='cta';nb.id='toEnd';nb.textContent='▶';
        nb.onclick=showEnd;document.getElementById('conf').appendChild(nb);}};
    fe.appendChild(b);
  });
}
function renderStep(){
  renderDots();var c=L();
  if(step===1)choiceStage({art:bag("#96223A","RBC"),q:c.p_q,opts:c.p_a,icons:['🔴','🟡','🟠'],correct:0,fb:c.p_fb,
    record:function(i){data.k1=['rbc','plt','ffp'][i]}});
  else if(step===2)choiceStage({art:bag("#96223A","?"),q:c.t_q,opts:c.t_a,icons:['7️⃣','9️⃣','🔟'],correct:0,fb:c.t_fb,
    record:function(i){data.k2=['7','9','10'][i]}});
  else if(step===3)choiceStage({art:granny(),q:c.s_q,scn:c.s_scn,opts:c.s_a,icons:['🩸','🤝','🔟'],correct:1,warnWrong:true,fb:c.s_fb,
    record:function(i){data.k3=['a','b','c'][i]}});
  else if(step===4)tfStage({q:c.f_q,answer:"false",fb:c.f_fb,
    record:function(v){data.k4=(v==="false"?'c':'a');data.misconception=(v==="true"?1:0)}});
  else if(step===5)choiceStage({art:bag("#96223A","1"),q:c.u_q,opts:c.u_a,icons:['➕','🔎'],correct:1,fb:c.u_fb,
    record:function(i){data.k5=['b','a'][i]}});
  else if(step===6)askStage();
  else showEnd();
}
function showEnd(){
  step=7;document.getElementById('dots').innerHTML='';currentSpeak=L().end_sub;
  var c=L(),sc=Math.min(stars,5);
  var st='★★★★★'.slice(0,sc)+'☆☆☆☆☆'.slice(0,5-sc);
  var lis=c.learned.map(function(x){return '<li>'+x+'</li>'}).join('');
  stageEl.innerHTML='<div class="center">'+trophy()+'<h2 class="big">'+c.end_title+'</h2>'+
    '<div class="stars">'+st+'</div><p class="lead">'+c.end_sub+'</p></div>'+
    '<div class="learned"><b style="font-family:var(--serif)">'+c.learned_h+'</b><ul style="margin:10px 0 0;padding:0">'+lis+'</ul></div>'+
    '<div class="demo"><p>'+c.demo_role_q+'</p><div class="miniopts" id="role"></div></div>'+
    '<div class="demo"><p>'+c.demo_age_q+'</p><div class="miniopts" id="age"></div></div>'+
    '<div class="demo"><p>'+c.clear_q+'</p><div class="miniopts" id="clr"></div></div>'+
    '<button class="cta" id="sub" disabled>'+c.submit+'</button>';
  mini('role',c.demo_role,function(i){data.role=ROLE_VAL[i];chk()});
  mini('age',c.demo_age,function(i){data.age=AGE_VAL[i];chk()});
  mini('clr',c.clear_opts,function(i){data.clarity=['clear','ok','hard'][i];chk()});
  document.getElementById('sub').onclick=submitAll;
}
function mini(id,labels,cb){var box=document.getElementById(id);
  labels.forEach(function(o,i){var b=document.createElement('button');b.textContent=o;
    b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');cb(i);};
    box.appendChild(b);});}
function chk(){document.getElementById('sub').disabled=!(data.clarity);}
function submitAll(){
  data.lang=lang;data.stars=Math.min(stars,5);
  try{ if(ENDPOINT){fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});}else{console.log("[game submit]",data);} }catch(e){}
  var c=L();
  stageEl.innerHTML='<div class="center" style="padding-top:36px">'+trophy()+
    '<h2 class="big">'+c.done_title+'</h2><p class="lead">'+c.done_sub+'</p>'+
    '<button class="cta" id="again" style="margin-top:22px">↻</button></div>';
  document.getElementById('again').onclick=function(){stars=0;data=blank();showStart()};
}
function buildLangBar(){var lb=document.getElementById('langbar');
  LANGS.forEach(function(p){var b=document.createElement('button');b.innerHTML=p[1];b.dataset.l=p[0];
    if(p[0]===lang)b.className='on';
    b.onclick=function(){lang=p[0];data.lang=lang;
      lb.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
      document.getElementById('brand').textContent=L().brand;
      document.getElementById('foot').textContent=L().foot;
      document.documentElement.lang=(lang==='zh'||lang==='nan')?'zh-Hant':lang;
      if(step===0)showStart();else if(step<=6)renderStep();else showEnd();};
    lb.appendChild(b);});}

buildLangBar();
document.getElementById('brand').textContent=L().brand;
document.getElementById('foot').textContent=L().foot;
showStart();
</script>
