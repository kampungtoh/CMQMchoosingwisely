 end_title:"ผ่านด่าน!", end_sub:"คุณเข้าใจแก่นของ “แค่ 7 ก็พอ” แล้ว จำไว้: เมื่อจำเป็น การให้เลือดช่วยชีวิต เมื่อไม่จำเป็น ให้น้อยปลอดภัยกว่า",
 learned_h:"สิ่งที่คุณได้เรียนรู้:", learned:["“แค่ 7 ก็พอ” พูดถึงเม็ดเลือดแดงเท่านั้น","7 เป็นค่าอ้างอิง ไม่ใช่สวิตช์","คงที่ไม่มีอาการ มักยังไม่ให้ก่อนได้","ทีละถุง แล้วประเมินซ้ำ","สามคำถามสำหรับถามหมอ"],
 demo_role_q:"คุณคือ?", demo_role:["ผู้ป่วย","ญาติ","ผู้ดูแล"], demo_age_q:"อายุของคุณ?", demo_age:["ต่ำกว่า 25","25-39","40-64","65 ขึ้นไป"],
 clear_q:"เข้าใจง่ายและสนุกไหม?", clear_opts:["ง่ายมาก","พอใช้","ยากไปหน่อย"],
 submit:"ส่ง", done_title:"ขอบคุณ!", done_sub:"ความคิดเห็นของคุณช่วยให้เราทำได้ดีขึ้น ขอให้คุณและครอบครัวสุขภาพดี",
 foot:"เพื่อการศึกษาเท่านั้น ไม่ใช่การทดแทนการรักษา หากฉุกเฉินให้พบแพทย์ทันที"}
};

var LANGS=[["zh-Hant","🇹🇼 繁中"],["zh-Hans","🇨🇳 简中"],["en","🇬🇧 EN"],["ja","🇯🇵 日本語"],["ko","🇰🇷 한국어"],["vi","🇻🇳 Tiếng Việt"],["id","🇮🇩 Bahasa"],["th","🇹🇭 ไทย"]];
var VERDICT={"zh-Hant":["答對了！","答錯了"],"zh-Hans":["答对了！","答错了"],"en":["Correct!","Not quite."],"ja":["正解！","残念…"],"ko":["정답!","아쉽네요"],"vi":["Chính xác!","Chưa đúng"],"id":["Benar!","Belum tepat"],"th":["ถูกต้อง!","ยังไม่ถูก"]};
function verdict(ok){var v=VERDICT[lang]||VERDICT["zh-Hant"];return '<b>'+(ok?v[0]:v[1])+'</b> ';}
var ROLE_VAL=["本人","家屬","陪病者／看護"], AGE_VAL=["<25","25-39","40-64","65+"];

/* ===== 資料收集：Google Forms（免後端、免權限）=====
   1. 建一份 Google 表單，每個欄位開一題（簡答、非必填）
   2. 右上「⋯ → 取得預先填入的連結」，取得每題的 entry.XXXX 代碼
   3. 把 formId（網址中 /d/e/ 後那段）與各 entry 代碼填到下面
   4. 回應分頁連到 Google Sheet 即可分析
   留空時只在 console 記錄，不影響遊戲運作。 */
/* 資料收集端：貼上你的 Google Apps Script 網頁應用程式網址（.../exec）。
   留空時只在 console 記錄，不影響遊戲運作。 */
var ENDPOINT="https://script.google.com/macros/s/AKfycbyck_i5rPDh5tBs8jsmtAVv-r9xgR1OABsde65edgdZcHP0HHyls6UKWCczyUgBHzv0/exec";

function getParam(k){try{return new URLSearchParams(location.search).get(k)}catch(e){return null}}
var URL_RID=getParam('rid'), SRC=getParam('src')||"direct";
var RID=URL_RID||('r'+Date.now()+Math.random().toString(36).slice(2,8));
var PRE=getParam('pre'), PRE_OK=getParam('pre_ok');
var _ql=getParam('lang');
var lang=(_ql&&STR[_ql])?_ql:"zh-Hant";
var step=0, stars=0, currentSpeak="";

function blank(){return {response_id:RID,source:SRC,ts:new Date().toISOString(),
  instrument:"game",mode:"post",phase:"後測",lang:lang,role:null,age:null,
  pre_answer:(PRE!==null?PRE:""),pre_correct:(PRE_OK!==null?PRE_OK:""),
  k1:null,k2:null,k3:null,k4:null,k5:null,misconception:null,
  k1_ok:null,k2_ok:null,k3_ok:null,k4_ok:null,k5_ok:null,score:null,
  act1:null,act2:null,self_efficacy:null,clarity:null,questions:[],stars:0};}
var data=blank();
function L(){return STR[lang]}

/* 語音：只保留國語（繁中／簡中），用 zh-TW 聲音 */
function hasVoice(){return lang==="zh-Hant"||lang==="zh-Hans"}
var VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
loadVoices();try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function pickZh(){var pref=['zh-tw','zh-hk','zh-cn','zh'];
  for(var i=0;i<pref.length;i++)for(var j=0;j<VOICES.length;j++){
    var vl=(VOICES[j].lang||'').toLowerCase().replace('_','-');
    if(vl.indexOf(pref[i])===0)return VOICES[j];}return null;}
function speak(txt){if(!hasVoice())return;try{window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance((txt||"").replace(/<[^>]+>/g,''));
  var v=pickZh();if(v){u.voice=v;u.lang=v.lang;}else{u.lang="zh-TW";}
  u.rate=0.95;u.pitch=1;window.speechSynthesis.speak(u);}catch(e){}}

/* ===== 原創血球角色（SVG）===== */
function rbc(badge){return '<svg class="art" viewBox="0 0 130 130" fill="none">'+
 '<defs><radialGradient id="rg" cx="40%" cy="34%" r="78%"><stop offset="0" stop-color="#ff7d9c"/><stop offset="1" stop-color="#c81e4a"/></radialGradient></defs>'+
 '<circle cx="65" cy="66" r="44" fill="url(#rg)"/>'+
 '<ellipse cx="65" cy="66" rx="22" ry="15" fill="#9c0f36" opacity=".5"/>'+
 '<circle cx="51" cy="59" r="6" fill="#fff"/><circle cx="79" cy="59" r="6" fill="#fff"/>'+
 '<circle cx="52.5" cy="60.5" r="2.8" fill="#3a0a18"/><circle cx="80.5" cy="60.5" r="2.8" fill="#3a0a18"/>'+
 '<path d="M54 75 q11 10 22 0" stroke="#3a0a18" stroke-width="3.2" fill="none" stroke-linecap="round"/>'+
 '<circle cx="44" cy="69" r="4.5" fill="#ff9db3" opacity=".8"/><circle cx="86" cy="69" r="4.5" fill="#ff9db3" opacity=".8"/>'+
 (badge?'<g><circle cx="95" cy="36" r="16" fill="#fbbf24"/><text x="95" y="42.5" text-anchor="middle" font-size="18" font-weight="800" fill="#7a1020" font-family="system-ui">'+badge+'</text></g>':'')+
 '</svg>'}
function bag(label){return '<svg class="art" viewBox="0 0 130 130" fill="none">'+
 '<rect x="42" y="28" width="46" height="70" rx="13" fill="#ff5d7d" opacity=".28"/>'+
 '<rect x="42" y="28" width="46" height="70" rx="13" stroke="#ffa7ba" stroke-width="2.5"/>'+
 '<rect x="57" y="19" width="16" height="12" rx="4" fill="#ffa7ba"/>'+
 (label?'<text x="65" y="72" text-anchor="middle" font-size="24" font-weight="800" fill="#ffe0e7" font-family="system-ui">'+label+'</text>':'')+
 '</svg>'}
function medal(){return '<svg class="art" viewBox="0 0 130 130" fill="none">'+
 '<path d="M50 78 L42 116 L65 104 L88 116 L80 78Z" fill="#e0518a"/>'+
 '<circle cx="65" cy="52" r="36" fill="#fbbf24"/><circle cx="65" cy="52" r="36" stroke="#fff" stroke-width="2" opacity=".55"/>'+
 '<text x="65" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#7a1020" font-family="system-ui">7</text></svg>'}
function granny(){return '<div class="emoji-art">👵</div>'}

/* ===== 遊戲流程 ===== */
var stageEl=document.getElementById('stage');
function renderDots(){var d=document.getElementById('dots'),h='';
  for(var i=1;i<=6;i++)h+='<span class="dot '+(step>i?'done':step===i?'cur':'')+'"></span>';d.innerHTML=h;}
function listenHTML(){return hasVoice()?'<button class="listen">'+L().listen+'</button>':''}
function attachListen(){var b=stageEl.querySelector('.listen');if(b)b.onclick=function(){speak(currentSpeak)};}

function showStart(){
  step=0;renderDots();currentSpeak=L().start_sub;
  stageEl.innerHTML='<div class="card center">'+rbc("7")+
    '<h2 class="big">'+L().start_title+'</h2><p class="lead">'+L().start_sub+'</p>'+
    '<button class="cta" id="go">'+L().start_btn+'</button></div>';
  document.getElementById('go').onclick=function(){step=1;renderStep()};
}
function choiceStage(cfg){
  currentSpeak=cfg.q;
  stageEl.innerHTML='<div class="card"><div class="scene">'+cfg.art+listenHTML()+'</div>'+
    '<h2 class="qt">'+cfg.q+'</h2>'+(cfg.scn?'<div class="scn">'+cfg.scn+'</div>':'')+
    '<div class="choices" id="ch"></div><div id="fbwrap"></div></div>';
  attachListen();
  var ch=document.getElementById('ch');
  cfg.opts.forEach(function(o,i){
    var b=document.createElement('button');b.className='ch';
    b.innerHTML='<span class="ic">'+(cfg.icons?cfg.icons[i]:'')+'</span>'+o;
    b.onclick=function(){
      if(document.getElementById('fbwrap').innerHTML)return;
      var correct=(i===cfg.correct);
      cfg.record(i);
      if(cfg.okKey)data[cfg.okKey]=correct?1:0;
      ch.querySelectorAll('.ch').forEach(function(x,j){x.classList.add(j===cfg.correct?'right':(j===i?'wrong':'dim'));x.onclick=null;});
      if(correct)stars++;
      document.getElementById('fbwrap').innerHTML='<div class="fbk'+(correct?'':' warn')+'">'+verdict(correct)+cfg.fb+'</div><button class="cta next" id="nx">▶</button>';
      document.getElementById('nx').onclick=function(){step++;renderStep()};
    };
    ch.appendChild(b);
  });
}
function tfStage(cfg){
  currentSpeak=cfg.q;
  stageEl.innerHTML='<div class="card"><div class="scene">'+bag("")+listenHTML()+'</div>'+
    '<h2 class="qt">'+cfg.q+'</h2>'+
    '<div class="tf" id="tf"><button data-v="true"><span class="em">🙆</span>'+L().tf_t+'</button>'+
    '<button data-v="false"><span class="em">🙅</span>'+L().tf_f+'</button></div><div id="fbwrap"></div></div>';
  attachListen();
  document.getElementById('tf').querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      if(document.getElementById('fbwrap').innerHTML)return;
      var v=b.dataset.v,ok=(v===cfg.answer);cfg.record(v);
      if(cfg.okKey)data[cfg.okKey]=ok?1:0;
      b.classList.add(ok?'tRight':'tWrong');if(ok)stars++;
      document.getElementById('fbwrap').innerHTML='<div class="fbk'+(ok?'':' warn')+'">'+verdict(ok)+cfg.fb+'</div><button class="cta next" id="nx">▶</button>';
      document.getElementById('nx').onclick=function(){step++;renderStep()};
    };
  });
}
function askStage(){
  var c=L();currentSpeak=c.a_q;
  stageEl.innerHTML='<div class="card"><div class="scene">'+rbc("")+listenHTML()+'</div>'+
    '<h2 class="qt">'+c.a_q+'</h2><div class="qcards" id="qc"></div><div id="conf"></div><div id="fbwrap"></div>'+
    '<button class="cta next" id="qnext" disabled>▶</button></div>';
  attachListen();
  var qc=document.getElementById('qc'),picked=[];
  c.a_cards.forEach(function(t,i){
    var b=document.createElement('button');b.className='qcard';
    b.innerHTML='<span class="tick">✓</span>'+t;
    b.onclick=function(){var k=picked.indexOf(i);
      if(k>=0){picked.splice(k,1);b.classList.remove('pick')}else{picked.push(i);b.classList.add('pick')}
      data.questions=picked.slice();
      document.getElementById('qnext').disabled=picked.length===0;};
    qc.appendChild(b);
  });
  document.getElementById('qnext').onclick=function(){finishAsk(picked)};
}
function finishAsk(picked){
  var c=L();
  var good=picked.filter(function(i){return i<3}).length;
  data.act1=(good>=1&&picked.indexOf(3)<0)?'會':(picked.indexOf(3)>=0&&good===0?'不會':'也許');
  data.act2=(picked.indexOf(1)>=0)?'知道':'不知道';
  if(good>=1&&picked.indexOf(3)<0)stars++;
  document.getElementById('qc').style.pointerEvents='none';
  document.getElementById('qnext').style.display='none';
  document.getElementById('fbwrap').innerHTML='<div class="fbk">'+c.a_fb+'</div>';
  var faces=['😟','😕','🙂','😃'];
  document.getElementById('conf').innerHTML='<div class="scene" style="margin-top:22px"><h2 class="qt" style="font-size:19px">'+c.conf_q+'</h2></div><div class="faces" id="faces"></div>';
  var fe=document.getElementById('faces');
  faces.forEach(function(em,i){
    var b=document.createElement('button');b.className='face';
    b.innerHTML='<span class="em">'+em+'</span><span class="fl">'+c.conf_faces[i]+'</span>';
    b.onclick=function(){fe.querySelectorAll('.face').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');data.self_efficacy=i+1;
      if(!document.getElementById('toEnd')){var nb=document.createElement('button');nb.className='cta next';nb.id='toEnd';nb.textContent='▶';
        nb.onclick=showEnd;document.getElementById('conf').appendChild(nb);}};
    fe.appendChild(b);
  });
}
function renderStep(){
  renderDots();var c=L();
  if(step===1)choiceStage({art:rbc("RBC"),q:c.p_q,opts:c.p_a,icons:['🔴','🟡','🟠'],correct:0,okKey:'k1_ok',fb:c.p_fb,
    record:function(i){data.k1=['rbc','plt','ffp'][i]}});
  else if(step===2)choiceStage({art:rbc("?"),q:c.t_q,opts:c.t_a,icons:['7️⃣','9️⃣','🔟'],correct:0,okKey:'k2_ok',fb:c.t_fb,
    record:function(i){data.k2=['7','9','10'][i]}});
  else if(step===3)choiceStage({art:granny(),q:c.s_q,scn:c.s_scn,opts:c.s_a,icons:['🩸','🤝','🔟'],correct:1,okKey:'k3_ok',fb:c.s_fb,
    record:function(i){data.k3=['a','b','c'][i]}});
  else if(step===4)tfStage({q:c.f_q,answer:"false",okKey:'k4_ok',fb:c.f_fb,
    record:function(v){data.k4=(v==="false"?'c':'a');data.misconception=(v==="true"?1:0)}});
  else if(step===5)choiceStage({art:bag("1"),q:c.u_q,opts:c.u_a,icons:['➕','🔎'],correct:1,okKey:'k5_ok',fb:c.u_fb,
    record:function(i){data.k5=['b','a'][i]}});
  else if(step===6)askStage();
  else showEnd();
}
function showEnd(){
  step=7;document.getElementById('dots').innerHTML='';currentSpeak=L().end_sub;
  var c=L(),sc=Math.min(stars,5);
  var st='★★★★★'.slice(0,sc)+'☆☆☆☆☆'.slice(0,5-sc);
  var lis=c.learned.map(function(x){return '<li>'+x+'</li>'}).join('');
  stageEl.innerHTML='<div class="card center">'+medal()+'<h2 class="big">'+c.end_title+'</h2>'+
    '<div class="stars">'+st+'</div><p class="lead">'+c.end_sub+'</p></div>'+
    '<div class="card" style="margin-top:16px"><div class="learned" style="margin-top:0;background:none;border:none;padding:0"><b>'+c.learned_h+'</b><ul>'+lis+'</ul></div>'+
    '<div class="demo"><p>'+c.demo_role_q+'</p><div class="miniopts" id="role"></div></div>'+
    '<div class="demo"><p>'+c.demo_age_q+'</p><div class="miniopts" id="age"></div></div>'+
    '<div class="demo"><p>'+c.clear_q+'</p><div class="miniopts" id="clr"></div></div>'+
    '<button class="cta" id="sub" style="width:100%" disabled>'+c.submit+'</button></div>';
  mini('role',c.demo_role,function(i){data.role=ROLE_VAL[i];chk()});
  mini('age',c.demo_age,function(i){data.age=AGE_VAL[i];chk()});
  mini('clr',c.clear_opts,function(i){data.clarity=['clear','ok','hard'][i];chk()});
  document.getElementById('sub').onclick=submitAll;
}
function mini(id,labels,cb){var box=document.getElementById(id);
  labels.forEach(function(o,i){var b=document.createElement('button');b.textContent=o;
    b.onclick=function(){box.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');cb(i);};
    box.appendChild(b);});}
function chk(){document.getElementById('sub').disabled=!(data.clarity);}

function submitToForm(d){
  if(!ENDPOINT){console.log("[game submit]",d);return;}
  try{ fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}); }catch(e){}
}
function submitAll(){
  data.lang=lang;data.stars=Math.min(stars,5);
  data.score=[data.k1_ok,data.k2_ok,data.k3_ok,data.k4_ok,data.k5_ok].reduce(function(a,b){return a+(b||0)},0);
  submitToForm(data);
  var c=L();
  stageEl.innerHTML='<div class="card center">'+medal()+
    '<h2 class="big">'+c.done_title+'</h2><p class="lead">'+c.done_sub+'</p>'+
    '<button class="cta" id="again">↻</button></div>';
  document.getElementById('again').onclick=function(){stars=0;data=blank();showStart()};
}

function buildLangBar(){var lb=document.getElementById('langbar');
  LANGS.forEach(function(p){var b=document.createElement('button');b.innerHTML=p[1];b.dataset.l=p[0];
    if(p[0]===lang)b.className='on';
    b.onclick=function(){lang=p[0];data.lang=lang;
      lb.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
      document.getElementById('brand').textContent=L().brand;
      document.getElementById('foot').textContent=L().foot;
      document.documentElement.lang=lang;
      if(step===0)showStart();else if(step<=6)renderStep();else showEnd();};
    lb.appendChild(b);});}

buildLangBar();
document.documentElement.lang=lang;
document.getElementById('brand').textContent=L().brand;
document.getElementById('foot').textContent=L().foot;
showStart();
</script>
