<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我需要輸血嗎？｜有 7 就好 · 奇美醫療財團法人奇美醫院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --o-bg:#fefaf6; --o-card:#ffffff; --o-fg:#2d2a26; --o-fg-soft:#575249; --o-fg-mute:#8f857a;
  --o-orb-1:#ffafd2; --o-orb-2:#a8e6cf; --o-orb-3:#c8b6ff; --o-orb-4:#ffd6a5; --o-orb-5:#b4e7ff; --o-orb-6:#ffaaa5;
  --o-accent:#e23a63; --o-line:#f0e8d8;
  --radius-md:16px; --radius-lg:28px; --radius-pill:999px;
  --font-body:'PingFang TC','PingFang SC','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Malgun Gothic','Apple SD Gothic Neo','Noto Sans TC','Noto Sans Thai','Inter',system-ui,sans-serif;
  --font-display:var(--font-body);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--o-bg);color:var(--o-fg);font-family:var(--font-body);
  font-size:18px;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.01em}
p{margin:0}
a{color:var(--o-accent);text-decoration:none}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;opacity:.5;will-change:transform;filter:blur(2px)}
.orb.sq{border-radius:22%}
.orb.o1{top:8%;left:9%;width:150px;height:150px;background:var(--o-orb-1);animation:of1 13s ease-in-out infinite}
.orb.o2{top:16%;right:7%;width:210px;height:210px;background:var(--o-orb-2);animation:of2 17s ease-in-out infinite reverse}
.orb.o3{top:52%;left:4%;width:180px;height:180px;background:var(--o-orb-3);animation:of1 15s ease-in-out infinite -3s}
.orb.o4{top:70%;right:12%;width:140px;height:140px;background:var(--o-orb-4);animation:of2 19s ease-in-out infinite -6s}
.orb.o5{top:40%;left:52%;width:190px;height:190px;background:var(--o-orb-5);animation:of3 21s ease-in-out infinite}
.orb.o6{top:28%;left:26%;width:110px;height:110px;background:var(--o-orb-6);animation:of1 11s ease-in-out infinite -2s}
.orb.o7{top:86%;left:40%;width:120px;height:120px;background:var(--o-orb-3);animation:of2 16s ease-in-out infinite -4s}
.orb.o8{top:60%;right:5%;width:100px;height:100px;background:var(--o-orb-1);animation:of3 14s ease-in-out infinite -5s}
.orb.o9{top:4%;left:60%;width:90px;height:90px;background:var(--o-orb-4);animation:of1 18s ease-in-out infinite -1s}
.orb.o10{top:78%;left:8%;width:130px;height:130px;background:var(--o-orb-5);animation:of2 20s ease-in-out infinite -7s}
@keyframes of1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-30px,0) rotate(8deg)}}
@keyframes of2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-18px,-24px,0) rotate(-6deg)}}
@keyframes of3{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(10px,-38px,0) rotate(5deg)}}

section,header,footer{position:relative;z-index:2}
header{padding:16px 0}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--o-fg-soft)}
.badge-brand svg{width:22px;height:22px;flex:none}
.langbar{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.langbar button{font-family:var(--font-body);font-size:13px;font-weight:600;border:1px solid #e6ddd0;
  background:var(--o-card);color:var(--o-fg-soft);padding:5px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.langbar button.on{background:var(--o-accent);border-color:var(--o-accent);color:#fff}
.caption{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--o-fg-soft)}

.hero{padding:44px 0 32px;text-align:center}
.hero .caption{margin-bottom:18px}
.hero h1{font-size:clamp(42px,6.5vw,78px);line-height:1.12;font-weight:700}
.hero .slogan{font-size:clamp(24px,3.6vw,36px);font-weight:700;margin-top:18px}
.hero .slogan .sev{color:var(--o-accent)}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--o-accent);color:#fff;
  font-weight:700;font-size:18px;padding:15px 30px;border-radius:var(--radius-pill);border:none;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px auto 0;max-width:540px}
.tile{background:var(--o-card);border-radius:var(--radius-lg);padding:24px 18px;text-align:center;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.tile .big{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--o-accent);line-height:1}
.tile .big .u{font-size:19px;font-weight:600;margin-left:2px}
.tile .lab{font-size:16px;color:var(--o-fg-soft);margin-top:10px;line-height:1.55}

.sec-head{text-align:center;margin-bottom:24px}
.sec-head h2{font-size:clamp(27px,3.8vw,42px);font-weight:600}
.sec-head p{color:var(--o-fg-soft);margin-top:8px;font-size:19px}

.intro{background:var(--o-card);border-radius:var(--radius-lg);padding:26px 28px;box-shadow:0 10px 30px rgba(45,42,38,.05);margin-bottom:20px}
.intro p{font-size:19px;color:var(--o-fg);line-height:1.9}
.intro p+p{margin-top:14px}
.intro b{color:var(--o-accent)}

.figure{margin:0 0 22px;text-align:center}
.figure img{max-width:100%;height:auto;border-radius:var(--radius-lg);box-shadow:0 14px 40px rgba(45,42,38,.12)}
.figure figcaption{font-size:14px;color:var(--o-fg-mute);margin-top:10px}

.pacc{background:var(--o-card);border-radius:var(--radius-lg);margin-bottom:13px;overflow:hidden;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.ph{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:none;padding:20px 22px;cursor:pointer;font-family:var(--font-body)}
.ph .dot{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex:none}
.ph .pt{flex:1}
.ph .pt h3{font-size:22px;font-weight:600}
.ph .pt .role{font-size:16px;color:var(--o-fg-soft);margin-top:2px}
.ph .tag7{background:var(--o-accent);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:var(--radius-pill);flex:none}
.ph .chev{color:var(--o-fg-mute);transition:.2s;flex:none;margin-left:4px}
.pacc.open .chev{transform:rotate(180deg)}
.pbody{max-height:0;overflow:hidden;transition:max-height .35s}
.pinner{padding:0 22px 22px 84px}
@media(max-width:560px){.pinner{padding:0 22px 22px 22px}}
.facet{border-top:1px solid var(--o-line);padding-top:13px;margin-top:13px}
.facet .fl{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--o-orb-3);padding:3px 11px;border-radius:var(--radius-pill);margin-bottom:7px}
.facet .fl.good{background:var(--o-orb-2);color:#1b6b52}
.facet .fl.bad{background:var(--o-orb-6);color:#8a2f2f}
.facet p{font-size:17.5px;color:var(--o-fg-soft);line-height:1.85}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:720px){.three{grid-template-columns:1fr}}
.scard{background:var(--o-card);border-radius:var(--radius-lg);padding:24px;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.scard .n{width:36px;height:36px;border-radius:50%;background:var(--o-orb-3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);font-size:18px}
.scard h3{font-size:19px;font-weight:600;margin:14px 0 8px}
.scard p{font-size:17px;color:var(--o-fg-soft)}
.exc{background:var(--o-card);border:2px solid var(--o-orb-6);border-radius:var(--radius-lg);padding:24px;margin-top:16px;box-shadow:0 10px 30px rgba(226,58,99,.06)}
.exc h3{font-size:19px;font-weight:600;color:#c23b56;margin-bottom:12px}
.exc ul{list-style:none;padding:0;margin:0}
.exc li{padding:7px 0 7px 28px;position:relative;font-size:17px;color:var(--o-fg-soft);line-height:1.65}
.exc li::before{content:"!";position:absolute;left:0;top:7px;width:19px;height:19px;background:var(--o-orb-6);color:#fff;font-size:12px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center}

.qa{background:var(--o-card);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;box-shadow:0 6px 20px rgba(45,42,38,.04)}
.qh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:18px 20px;cursor:pointer;font-family:var(--font-body);font-size:18.5px;font-weight:600;color:var(--o-fg)}
.qh .qm{width:28px;height:28px;border-radius:50%;background:var(--o-orb-2);color:#1b6b52;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.qh .chev{margin-left:auto;color:var(--o-fg-mute);transition:.2s;flex:none}
.qa.open .chev{transform:rotate(180deg)}
.qb{max-height:0;overflow:hidden;transition:max-height .3s}
.qi{padding:0 20px 18px 60px;color:var(--o-fg-soft);font-size:17.5px;line-height:1.85}
.qi b{color:var(--o-fg)}

.ask{background:var(--o-card);border-radius:var(--radius-lg);padding:28px;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.ask ol{margin:0;padding-left:24px}
.ask li{font-size:19px;font-weight:600;margin-bottom:13px;line-height:1.5}
.ask .safe{margin-top:14px;background:var(--o-bg);border-radius:var(--radius-md);padding:15px 17px;font-size:16.5px;color:var(--o-fg-soft);font-weight:400}
.ask .safe b{color:var(--o-accent)}
.tip{background:var(--o-card);border-left:5px solid var(--o-orb-4);border-radius:var(--radius-md);padding:20px 24px;margin-top:16px;box-shadow:0 10px 30px rgba(45,42,38,.04)}
.tip h3{font-size:18px;font-weight:600;margin-bottom:10px}
.tip li{font-size:17px;color:var(--o-fg-soft);margin-bottom:7px;list-style:none;padding-left:26px;position:relative;line-height:1.6}
.tip li::before{content:"\2713";position:absolute;left:0;color:#c99a2e;font-weight:700}

footer{padding:38px 0 60px;text-align:center}
.disc{background:var(--o-card);border-radius:var(--radius-lg);padding:22px 26px;font-size:14px;color:var(--o-fg-mute);line-height:1.75;box-shadow:0 10px 30px rgba(45,42,38,.04)}

.pt-overlay{position:fixed;inset:0;z-index:100;background:rgba(45,42,38,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px}
.pt-card{background:var(--o-card);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:94vh;overflow:auto;padding:24px 24px 20px;box-shadow:0 30px 80px rgba(45,42,38,.28)}
.plangbar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.plangbar button{font-family:var(--font-body);font-size:12px;font-weight:600;border:1px solid #e6ddd0;background:var(--o-bg);color:var(--o-fg-soft);padding:4px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.plangbar button.on{background:var(--o-accent);border-color:var(--o-accent);color:#fff}
.pt-card h3{font-size:22px;font-weight:700;text-align:center;line-height:1.4}
.pt-note{font-size:14px;color:var(--o-fg-mute);text-align:center;margin:8px 0 18px;line-height:1.6}
.pt-q{font-size:19px;font-weight:600;line-height:1.6;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--o-bg);border:2px solid var(--o-line);border-radius:14px;padding:14px 16px;margin-bottom:11px;font-family:var(--font-body);font-size:17px;line-height:1.55;color:var(--o-fg);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--o-orb-3)}
.pt-skip{display:block;margin:4px auto 0;background:none;border:none;color:var(--o-fg-mute);font-size:14px;text-decoration:underline;cursor:pointer;font-family:var(--font-body)}
.pt-thanks{text-align:center;padding:14px 0 6px}
.pt-thanks p{font-size:18px;font-weight:600;margin-bottom:18px}
.enterbtn{background:var(--o-accent);color:#fff;border:none;border-radius:var(--radius-pill);font-weight:700;font-size:18px;padding:13px 30px;cursor:pointer;font-family:var(--font-body)}

.thr{max-width:640px;margin:0 auto;background:var(--o-card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.thr-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 22px;border-top:1px solid var(--o-line)}
.thr-row:first-child{border-top:none}
.thr-c{font-size:17px;color:var(--o-fg);font-weight:600}
.thr-v{font-size:17px;color:var(--o-accent);font-weight:700;white-space:nowrap;text-align:right}
.thr-note{text-align:center;font-size:15px;color:var(--o-fg-mute);margin-top:14px;line-height:1.6}
.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.alts{grid-template-columns:1fr}}
.altc{background:var(--o-card);border-radius:var(--radius-lg);padding:20px;box-shadow:0 10px 30px rgba(45,42,38,.05);display:flex;gap:13px;align-items:flex-start}
.altc .ai{font-size:26px;flex:none;line-height:1.1}
.altc .an{font-size:18px;font-weight:600;margin-bottom:4px}
.altc .ad{font-size:15.5px;color:var(--o-fg-soft);line-height:1.6}
.gift{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){.gift{grid-template-columns:repeat(2,1fr)}}
.giftc{background:var(--o-card);border-radius:var(--radius-lg);padding:22px 16px;text-align:center;box-shadow:0 10px 30px rgba(45,42,38,.05)}
.giftc .gb{font-family:var(--font-display);font-size:25px;font-weight:700;color:var(--o-accent);line-height:1.15}
.giftc .gl{font-size:15px;color:var(--o-fg-soft);margin-top:8px;line-height:1.5}
.gift-close{text-align:center;font-size:17px;color:var(--o-fg-soft);margin-top:18px;font-weight:600}
.togame{background:linear-gradient(135deg,#ffffff,#fef2f6);border:2px solid var(--o-accent);border-radius:var(--radius-lg);padding:34px 28px;text-align:center;box-shadow:0 14px 40px rgba(226,58,99,.1)}
.togame h2{font-size:clamp(24px,3.4vw,34px);font-weight:700}
.togame p{font-size:18px;color:var(--o-fg-soft);margin:12px 0 22px;line-height:1.7}
.togame .cta{text-decoration:none}

#kinds,#meaning,#thresholds,#alts,#faq,#ask,#precious,#togame{padding:30px 0}

@media(max-width:600px){
  .wrap{padding:0 16px}
  body{font-size:17px}
  header{padding:12px 0}
  .badge-brand{font-size:13px}
  .badge-brand svg{width:20px;height:20px}
  .langbar{margin-left:0;width:100%;justify-content:flex-start;gap:6px 5px;margin-top:6px}
  .langbar button{font-size:12px;padding:5px 9px}
  .hero{padding:30px 0 22px}
  .hero .caption{margin-bottom:12px}
  #kinds,#meaning,#thresholds,#alts,#faq,#ask,#precious,#togame{padding:24px 0}
  .sec-head{margin-bottom:18px}
  .intro{padding:20px 18px}
  .ph{padding:16px 15px;gap:11px}
  .ph .dot{width:42px;height:42px;font-size:14px}
  .ph .pt h3{font-size:20px}
  .ph .tag7{font-size:12px;padding:3px 10px}
  .pinner{padding:0 18px 18px 18px}
  .scard{padding:20px}
  .exc{padding:20px}
  .qh{padding:16px 15px;font-size:17px}
  .qi{padding:0 16px 16px 50px;font-size:16.5px}
  .ask{padding:22px 18px}
  .altc{padding:17px}
  .thr-row{padding:13px 16px}
  .thr-c,.thr-v{font-size:16px}
  .togame{padding:26px 20px}
  .togame p{font-size:16.5px}
  .giftc{padding:18px 12px}
  .giftc .gb{font-size:21px}
  .pt-card{padding:20px 18px 16px}
  .pt-card h3{font-size:20px}
  .pt-q{font-size:18px}
  .opt{font-size:16px;padding:13px 14px}
}

@media (prefers-reduced-motion: reduce){ .orb{animation:none !important} }
</style>
</head>
<body data-motion-type="loop">

<div class="pt-overlay" id="pretest">
  <div class="pt-card">
    <div class="plangbar" id="pt_langbar"></div>
    <h3 id="pt_intro"></h3>

      <p class="pt-q" id="pt_q"></p>

      <p id="pt_thanks"></p>
      <button class="enterbtn" id="pt_enter" onclick="closePre()"></button>
    </div>
  </div>
</div>

<div class="orbs" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2 sq"></span><span class="orb o3"></span>
  <span class="orb o4"></span><span class="orb o5"></span><span class="orb o6 sq"></span>
  <span class="orb o7"></span><span class="orb o8"></span><span class="orb o9 sq"></span><span class="orb o10"></span>
</div>

<header><div class="wrap"><div class="hd">
  <span class="badge-brand"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13Z" fill="#e23a63"/></svg><span id="brand"></span></span>
  <div class="langbar" id="langbar"></div>
</div></div></header>

<section class="hero"><div class="wrap">
  <p class="caption" id="caption"></p>
  <h1 id="htitle"></h1>
  <p class="slogan" id="hslogan"></p>
  <button class="cta" id="cta" onclick="document.getElementById('kinds').scrollIntoView()"></button>
</div></section>

<section id="kinds"><div class="wrap">
  <div class="sec-head"><h2 id="kinds_h"></h2><p id="kinds_sub"></p></div>
  <div id="prodbox"></div>
</div></section>

<section id="meaning"><div class="wrap">
  <div class="sec-head"><h2 id="meaning_h"></h2><p id="meaning_sub"></p></div>
  <div class="stats">
    <div class="tile"><div class="big">7<span class="u">g/dL</span></div><div class="lab" id="tile1"></div></div>

  </div>

 intro:['「有 7 就好」是一句好記的口號。這裡的 <b>7</b> 指的是<b>血紅素（Hb）</b>，也就是紅血球裡負責帶氧的蛋白質，是醫師用來衡量貧血程度的數值，單位是 <b>g/dL</b>。',
  '它的意思是：對大部分病況穩定、沒有一直在流血的成年病人來說，血紅素維持在 <b>7 g/dL 以上</b>通常就夠用，不一定要輸血；要等到<b>低於 7 g/dL</b>，醫師才會開始評估需不需要輸紅血球。這在國際上叫「限制性輸血策略」，因為研究發現，對穩定的病人來說，輸得多並不會比較好，反而多了風險。',

  {q:"血紅素低，醫師卻說先不輸，為什麼？",a:"如果只是稍低、沒有不舒服、也沒出血，輸血好處有限、風險照樣在。醫師會先找原因、用更根本的方式改善，這樣更安全。"},
  {q:"輸血前要簽同意書嗎？為什麼？",a:"需要。輸血是有風險的治療，醫師會先說明<b>為什麼需要、有什麼風險、有沒有其他選擇</b>，你了解後簽署輸血同意書。簽之前有疑問一定要當場問清楚。"},

  {q:"輸血過程中覺得不舒服怎麼辦？",a:"出現發冷、發燒、起紅疹、喘、胸悶、腰痠或任何不舒服，請<b>立刻按鈴或告訴護理人員</b>，會馬上停下處理。"},
  {q:"輸血會不會傳染疾病？",a:"現代血品都經嚴格檢驗，因輸血感染的風險已<b>非常低</b>，但不是零。能避免的輸血就避免不必要的風險。"},
  {q:"輸血有什麼風險或副作用？",a:"較常見的是發燒或過敏。輸太多太快可能造成體液過多、呼吸困難。嚴重反應很少見。鐵過量主要發生在<b>反覆多次輸血</b>的人。"},
  {q:"除了輸血，還有別的方法嗎？",a:"有。缺鐵性貧血可以補鐵；手術可以先把貧血養好、術中用止血藥、把流失的血回收再輸回自己。哪種適合你，問醫師。"},
  {q:"我可以拒絕輸血嗎？",a:"你有權參與並表達意見。若考慮不輸，請先和醫療團隊<b>討論後果和替代方案</b>，一起做出對你安全又符合你想法的決定。"},
  {q:"血是從哪裡來的？",a:"都來自善心民眾的無償捐血，經嚴格檢驗後供應。血源有限又珍貴，「需要才輸、夠用就好」也是珍惜這份心意。"}],

 intro:['「有 7 就好」是一句好记的口号。这里的 <b>7</b> 指的是<b>血红素（Hb）</b>，也就是红细胞里负责带氧的蛋白质，是医师用来衡量贫血程度的数值，单位是 <b>g/dL</b>。',

  {q:"输血前要签同意书吗？为什么？",a:"需要。输血是有风险的治疗，医师会先说明<b>为什么需要、有什么风险、有没有其他选择</b>，你了解后签署输血同意书。签之前有疑问一定要当场问清楚。"},
  {q:"输血前为什么要一直核对姓名、血型？",a:"因为<b>输错血非常危险</b>。输血前医护会和你一起核对姓名、病历号、血型和血袋资料，确认无误才开始。请一起帮忙确认，这是保护你最重要的一关。"},
  {q:"输血过程中觉得不舒服怎么办？",a:"出现发冷、发烧、起红疹、气喘、胸闷、腰酸或任何不舒服，请<b>立刻按铃或告诉护理人员</b>，会马上停下处理。"},
  {q:"输血会不会传染疾病？",a:"现代血品都经严格检验，因输血感染的风险已<b>非常低</b>，但不是零。能避免的输血就避免不必要的风险。"},
  {q:"输血有什么风险或副作用？",a:"较常见的是发烧或过敏。输太多太快可能造成体液过多、呼吸困难。严重反应很少见。铁过量主要发生在<b>反复多次输血</b>的人。"},
  {q:"除了输血，还有别的方法吗？",a:"有。缺铁性贫血可以补铁；手术可以先把贫血养好、术中用止血药、把流失的血回收再输回自己。哪种适合你，问医师。"},
  {q:"我可以拒绝输血吗？",a:"你有权参与并表达意见。若考虑不输，请先和医疗团队<b>讨论后果和替代方案</b>，一起做出对你安全又符合你想法的决定。"},
  {q:"血是从哪里来的？",a:"都来自善心民众的无偿捐血，经严格检验后供应。血源有限又珍贵，「需要才输、够用就好」也是珍惜这份心意。"}],
 ask_h:"输红细胞前可以问医师的三个问题",ask_sub:"一起做最适合你的决定。",
 ask:["我现在为什么需要输红细胞？","有没有先治疗贫血、或控制出血的方法？","如果需要输，可以先输 1 袋，再评估吗？"],
 ask_safe:"<b>重要：</b>请不要只看数字就自己要求或拒绝输血。该不该输，请和医疗团队一起评估。真正需要时，及时输血能救命。",
 tip_h:"输血当天的小提醒",tip:["签输血同意书前，把不懂的地方问清楚再签","输血前，和医护一起核对你的姓名、血型和血袋资料","输血中有任何不舒服，马上按铃告诉护理人员"],
 disc:"本页为卫教信息，不能取代医师诊疗。紧急时请立即就医。<br>奇美医疗财团法人奇美医院 · 品质管理部 × 明智选择 Choosing Wisely"},

"en":{lang:"en",brand:"Chi Mei Medical Center",caption:"Choosing Wisely",
 htitle:"Do I need a transfusion?",hslogan:'Choose wisely: a <span class="sev">7</span> is enough',cta:"Learn more ↓",
 kinds_h:"The doctor says I need a transfusion. What is being transfused?",kinds_sub:"Tap each one to learn what it is, why and when it is used, how it is given, and its benefits and side effects.",
 whatL:"What it is",whyL:"Why it is used",whenL:"When it is used",howL:"How it is given",goodL:"Benefits",badL:"Side effects",tag7:"A 7 is enough",
 products:[
  {name:"Red cells",ab:"RBC",seven:true,role:"The most common blood cell; carries oxygen around the body",
   what:"Red cells are the most common cells in blood. Their hemoglobin (Hb) grabs oxygen and carries it from the lungs to the whole body. Donated blood is separated and concentrated into one bag, known as packed red cells (RBC).",
   why:"When red cells are too few (anemia) or heavily lost, the body lacks oxygen, causing breathlessness, fatigue, dizziness and paleness. Transfusing red cells restores oxygen-carrying capacity.",
   when:"Symptomatic severe anemia, or heavy bleeding from surgery or trauma. For most stable adults, transfusion is only assessed when Hb falls below 7 g/dL.",
   how:"Given through an arm vein by drip. A bag is about 250 to 350 mL, usually infused over 1.5 to 4 hours, with nurses observing you throughout.",
   good:"Quickly relieves low-oxygen symptoms like breathlessness and weakness, and can be lifesaving in major bleeding.",
   bad:"Possible fever or allergy; too much too fast can overload the heart and lungs (fluid overload), so the elderly and heart patients need care; serious reactions are rare; repeated transfusions may cause iron overload."},
  {name:"Platelets",ab:"PLT",seven:false,role:"Tiny fragments that help stop bleeding",
   what:"Platelets are tiny fragments in blood that help stop bleeding (not whole cells). When you bleed, they clump together to plug the wound and form a clot. Called Platelet (PLT).",
   why:"When platelets are too few or work poorly, you bruise easily and bleed for a long time, sometimes spontaneously. Transfusing platelets restores clotting ability.",
   when:"Very low platelets with bleeding, or very low platelets before surgery or an invasive procedure. Judged by the platelet count, not by Hb 7 g/dL.",
   how:"Also given by vein drip, usually faster than red cells, about 30 minutes to 1 hour.",
   good:"Helps stop bleeding and prevents serious bleeding.",
   bad:"Fever and allergy are more common; because platelets are stored at room temperature, bacterial contamination risk is relatively higher, so checking and observation matter."},
  {name:"Plasma",ab:"FFP",seven:false,role:"Pale yellow liquid that replaces clotting factors",
   what:"After the blood cells are removed, the pale yellow liquid left is plasma, which contains many clotting factors (proteins that help blood clot). Frozen fresh and thawed before use, called FFP.",
   why:"When the body lacks several clotting factors and bleeds because blood will not clot easily, plasma replaces those factors at once.",
   when:"Bleeding with multiple clotting-factor deficiency, bleeding from certain anticoagulant drugs, or massive transfusion. Judged by clotting tests, not by Hb 7 g/dL.",
   how:"Thawed and given by vein drip. Because the volume is larger, the heart and lung load is watched.",
   good:"Replaces multiple clotting factors and helps stop bleeding.",
   bad:"Allergy and fever; larger volumes may cause fluid overload and breathlessness."},
  {name:"Cryoprecipitate",ab:"Cryo",seven:false,role:"Concentrated fibrinogen and clotting material",
   what:"When plasma is processed at low temperature, a small concentrated portion settles out, especially rich in fibrinogen, the key raw material for forming a clot. Called Cryoprecipitate (Cryo).",
   why:"When fibrinogen is too low and a clot will not form during serious bleeding, it quickly replaces this key material.",
   when:"Low fibrinogen with serious bleeding, such as obstetric hemorrhage or major surgery. Judged by fibrinogen level, not by Hb 7 g/dL.",
   how:"Thawed and given by vein; small in volume.",
   good:"Concentrated fibrinogen replacement to help stop bleeding.",
   bad:"Allergy and fever, relatively uncommon."}],
 meaning_h:"What does “a 7 is enough” mean?",meaning_sub:"For most stable adults without ongoing bleeding, a hemoglobin of 7 g/dL or above is usually enough.",
 tile1:"or above is usually enough",tile2u:" bag",tile2:"One bag first, then reassess",
 intro:['“A 7 is enough” is an easy-to-remember slogan. Here <b>7</b> means <b>hemoglobin (Hb)</b>, the oxygen-carrying protein in red cells that doctors use to gauge anemia, measured in <b>g/dL</b>.',
  'It means: for most stable adult patients who are not continuously bleeding, keeping hemoglobin <b>at 7 g/dL or above</b> is usually enough, and a transfusion is not always needed; only <b>below 7 g/dL</b> does the doctor start to assess whether red cells are needed. Internationally this is the “restrictive transfusion strategy,” because research shows that for stable patients, transfusing more is not better and adds risk.',
  'Remember: this <b>7 g/dL is a reference for red cells</b>, not for platelets or plasma; and it is a “guide,” not a “fixed rule.”'],
 postercap:"Chi Mei Medical Center · Patient Blood Management team · Transfusion Committee",
 cards:[{h:"7 is a guide, not a switch",p:"Below 7 g/dL does not always mean transfuse; above 7 g/dL does not always mean don't. The team weighs symptoms, bleeding, heart and other conditions. For cardiac or orthopedic surgery, or heart disease, the mark may be 7.5 or 8 g/dL."},
  {h:"One bag, then reassess",p:"For stable patients without bleeding, give one bag when needed, then check symptoms and hemoglobin, and give another only if truly needed."},
  {h:"Not transfusing is not doing nothing",p:"If held, the team still finds the cause of anemia, gives iron, controls bleeding and treats the illness. When truly needed, it is given promptly."}],
 exc_h:"These need individual assessment (different standard)",
 exc:["Active heavy bleeding or unstable circulation","Acute myocardial infarction / acute coronary syndrome (guidelines suggest assessing below Hb 10 g/dL)","Conditions needing regular long-term transfusion","Clear symptoms, e.g. severe breathlessness or chest tightness"],
 faq_h:"Common questions",faq_sub:"Tap to see the answer.",
 faqs:[{q:"Does “a 7 is enough” apply to all transfusions?",a:"No. <b>Only red cells.</b> Platelets, plasma and cryoprecipitate each have their own standards, not this 7 g/dL."},
  {q:"My hemoglobin is low but the doctor says hold off. Why?",a:"If it is only mildly low with no symptoms and no bleeding, benefit is limited while risk remains. The doctor finds the cause and treats it more fundamentally, which is safer."},
  {q:"Do I sign a consent form before transfusion? Why?",a:"Yes. Transfusion is a treatment with risks, so the doctor explains <b>why it is needed, the risks, and any alternatives</b>, and you sign a transfusion consent form. Ask anything you are unsure about before signing."},
  {q:"Why are my name and blood type checked repeatedly?",a:"Because <b>giving the wrong blood is very dangerous</b>. Before transfusion, staff check your name, record number, blood type and bag details with you. Please help confirm; this is the most important safety step."},
  {q:"What if I feel unwell during transfusion?",a:"If you feel chills, fever, rash, breathlessness, chest tightness, back ache or any discomfort, <b>press the call bell or tell a nurse immediately</b>; it will be stopped and managed at once."},
  {q:"Can transfusion transmit disease?",a:"Modern blood is rigorously screened, so infection risk is <b>very low</b> but not zero. Avoiding unnecessary transfusion avoids unnecessary risk."},
  {q:"What are the risks or side effects?",a:"Fever or allergy are the more common ones. Too much too fast can cause fluid overload and breathlessness. Serious reactions are rare. Iron overload mainly affects people transfused <b>repeatedly</b>."},
  {q:"Are there alternatives to transfusion?",a:"Yes. Iron-deficiency anemia can be treated with iron; for surgery, anemia can be corrected beforehand, drugs can reduce bleeding, and lost blood can be salvaged back to you. Ask your doctor which fits."},
  {q:"Can I refuse a transfusion?",a:"You have the right to take part and speak up. If you are considering not transfusing, first <b>discuss the consequences and alternatives</b> with the team to decide together what is safe and fits your wishes."},
  {q:"Where does the blood come from?",a:"All from voluntary donors, screened before use. Blood is limited and precious, so “transfuse only when needed, just enough” also honors that gift."}],
 ask_h:"Three questions to ask before red cell transfusion",ask_sub:"Deciding together what is best for you.",
 ask:["Why do I need red cells now?","Is there a way to treat the anemia or control bleeding first?","If needed, can we give one bag first, then reassess?"],
 ask_safe:"<b>Important:</b> Please do not request or refuse a transfusion based on the number alone. Whether to transfuse should be assessed with your care team. When truly needed, prompt transfusion saves lives.",
 tip_h:"Reminders on transfusion day",tip:["Before signing the consent form, ask about anything you do not understand","Before transfusion, check your name, blood type and bag details with the staff","If you feel any discomfort during transfusion, press the call bell and tell a nurse"],
 disc:"This page is educational and does not replace medical care. In an emergency, seek care immediately.<br>Chi Mei Medical Center · Quality Management × Choosing Wisely"},

"ja":{lang:"ja",brand:"奇美医療財団法人奇美病院",caption:"Choosing Wisely（賢明な選択）",
 htitle:"輸血は必要ですか？",hslogan:'賢明な選択、<span class="sev">7</span> で十分',cta:"詳しく見る ↓",
 kinds_h:"「輸血が必要」と言われた。いったい何を輸血するの？",kinds_sub:"それぞれをタップして、何か、なぜ・いつ使うか、どう行うか、利点と副作用を確認しましょう。",
 whatL:"これは何",whyL:"なぜ使う",whenL:"どんな時に使う",howL:"どう行う",goodL:"利点",badL:"副作用",tag7:"7 で十分",
 products:[
  {name:"赤血球",ab:"RBC",seven:true,role:"血液で最も多い細胞。酸素を全身に運ぶ",
   what:"赤血球は血液で最も多い細胞で、中のヘモグロビン（Hb）が酸素をつかみ、肺から全身へ運びます。提供された血液を分離・濃縮した一袋が「赤血球濃厚液（RBC）」です。",
   why:"赤血球が少ない（貧血）または大量に失われると、体が酸素不足になり、息切れ・疲れ・めまい・顔色不良が出ます。輸血は酸素を運ぶ力を補います。",
   when:"症状のある重い貧血、手術や外傷での大量出血のときです。状態が安定した多くの成人では、Hb が 7 g/dL を下回って初めて必要性を評価します。",
   how:"腕の静脈から点滴で入れます。一袋は約250〜350 mLで、通常1.5〜4時間かけ、看護師が経過を観察します。",
   good:"息切れや倦怠感など酸素不足の症状を速やかに改善し、大量出血では救命になります。",
   bad:"発熱やアレルギーのことがあります。速すぎ・多すぎると心肺に負担（体液過剰）がかかり、高齢者や心臓病の方は注意が必要です。重い反応はまれです。反復輸血では鉄過剰の可能性があります。"},
  {name:"血小板",ab:"PLT",seven:false,role:"止血を助ける小さな断片",
   what:"血小板は止血を助ける小さな断片（完全な細胞ではありません）。出血すると集まって傷をふさぎ、血のかたまりを作ります。英語で Platelet（PLT）。",
   why:"血小板が少ない・働きが悪いと、あざができやすく出血が止まりにくく、時に自然出血します。輸血で止血する力を補います。",
   when:"血小板がとても低く出血がある時、または低い状態で手術や侵襲的検査の前。判断は血小板数で行い、Hb 7 g/dL ではありません。",
   how:"同じく静脈から点滴で入れ、通常は赤血球より速く約30分〜1時間です。",
   good:"止血を助け、重い出血を防ぎます。",
   bad:"発熱・アレルギーが比較的多いです。室温で保存するため細菌汚染の可能性がやや高く、照合と観察が特に大切です。"},
  {name:"血漿",ab:"FFP",seven:false,role:"多くの凝固因子を補う淡黄色の液体",
   what:"血液から血球を除いた淡黄色の液体が血漿で、血を固める働きの「凝固因子」というたんぱく質を多く含みます。新鮮なうちに凍結し、使う前に解凍します（FFP）。",
   why:"複数の凝固因子が不足して血が固まりにくく出血しているとき、血漿でこれらを一度に補います。",
   when:"出血に凝固異常を伴うとき、抗凝固薬による出血、大量輸血のとき。判断は凝固検査で行い、Hb 7 g/dL ではありません。",
   how:"解凍して静脈から点滴で入れます。量が多いため心肺の負担に注意します。",
   good:"複数の凝固因子を補い、止血を助けます。",
   bad:"アレルギー・発熱。量が多いと体液過剰や息切れが起こることがあります。"},
  {name:"クリオプレシピテート",ab:"Cryo",seven:false,role:"フィブリノゲンなどを濃縮した凝固原料",
   what:"血漿を低温で処理すると沈殿する濃縮成分で、血のかたまりの主原料である「フィブリノゲン」を特に多く含みます（Cryoprecipitate、略して Cryo）。",
   why:"フィブリノゲンが低くかたまりが作れず、重い出血があるとき、この主原料を素早く補います。",
   when:"フィブリノゲン低下に重い出血を伴うとき（産科大量出血、大手術など）。判断はフィブリノゲン値で行い、Hb 7 g/dL ではありません。",
   how:"解凍して静脈から入れます。量は少なめです。",
   good:"フィブリノゲンを濃縮して補い、止血を助けます。",
   bad:"アレルギー・発熱など。比較的まれです。"}],
 meaning_h:"「7 で十分」とはどういう意味？",meaning_sub:"状態が安定し出血の続いていない多くの成人では、ヘモグロビン 7 g/dL 以上あれば通常は十分です。",
 tile1:"以上あれば通常は十分",tile2u:"袋",tile2:"まず1袋、終えてから再評価",
 intro:['「7 で十分」は覚えやすい標語です。ここでの <b>7</b> は <b>ヘモグロビン（Hb）</b>、赤血球で酸素を運ぶたんぱく質で、貧血の程度を測る値、単位は <b>g/dL</b> です。',
  '意味はこうです。出血が続いていない安定した多くの成人では、Hb を <b>7 g/dL 以上</b> に保てば通常は十分で、必ず輸血が必要とは限りません。<b>7 g/dL を下回って</b> はじめて、赤血球の輸血が必要かを医師が評価します。これは国際的に「制限的輸血戦略」と呼ばれ、安定した患者では多く輸血しても良くはならず、かえって危険が増えると分かっているためです。',
  '覚えておいてください。この <b>7 g/dL は赤血球の目安</b> で、血小板や血漿には当てはまりません。しかも「目安」であり「絶対の規則」ではありません。'],
 postercap:"奇美医療財団法人奇美病院 · PBM（患者血液管理）推進チーム · 輸血委員会",
 cards:[{h:"7 は目安、スイッチではない",p:"7 g/dL 未満でも必ず輸血ではなく、7 g/dL 超でも必ず不可ではありません。医師は症状・出血・心臓や他の病気を合わせて判断します。心臓や整形の手術、心疾患のある方では 7.5 や 8 g/dL のこともあります。"},
  {h:"1袋、そして再評価",p:"安定し出血のない患者では、必要なとき1袋を原則とし、終えてから症状と Hb を見て、本当に必要な時だけ次の袋を入れます。"},
  {h:"輸血しない＝何もしない、ではない",p:"見送っても、医療チームは貧血の原因を探し、鉄剤を使い、出血を抑え、病気そのものを治療します。本当に必要な時は速やかに行います。"}],
 exc_h:"これらは個別評価が必要（基準が異なる）",
 exc:["大量に出血中、または循環が不安定","急性心筋梗塞・急性冠症候群（Hb 10 g/dL 未満で評価を推奨）","長期に定期輸血が必要な病気","強い息切れや胸の圧迫感などの明らかな症状"],
 faq_h:"よくある質問",faq_sub:"タップして答えを見る。",
 faqs:[{q:"「7 で十分」はすべての輸血に当てはまる？",a:"いいえ。<b>赤血球だけ</b>です。血小板・血漿・クリオはそれぞれ別の基準で、この 7 g/dL では判断しません。"},
  {q:"Hb が低いのに医師は輸血を見送ると言う。なぜ？",a:"少し低いだけで症状も出血もなければ、利点は限られ危険は残ります。医師は原因を探して根本から改善します。その方が安全です。"},
  {q:"輸血前に同意書に署名しますか？なぜ？",a:"はい。輸血は危険を伴う治療なので、医師が<b>必要な理由・危険・他の選択肢</b>を説明し、理解のうえで同意書に署名します。不明点は署名前に必ず確認してください。"},
  {q:"なぜ名前や血液型を何度も確認するの？",a:"<b>血液の取り違えは非常に危険</b>だからです。輸血前に、氏名・診察券番号・血液型・血液バッグを一緒に確認してから始めます。ご協力ください。最も大切な安全の関門です。"},
  {q:"輸血中に気分が悪くなったら？",a:"悪寒・発熱・発疹・息切れ・胸の圧迫・腰の痛みなど不調があれば、<b>すぐに看護師へ</b>。直ちに止めて対応します。"},
  {q:"輸血で病気がうつる？",a:"現在の血液は厳しく検査され、感染の危険は<b>非常に低い</b>ですが、ゼロではありません。不要な輸血を避けることで不要な危険を避けます。"},
  {q:"どんな危険・副作用がある？",a:"多いのは発熱やアレルギーです。速すぎ・多すぎると体液過剰や呼吸困難のことも。重い反応はまれです。鉄過剰は主に<b>繰り返し輸血</b>する人に起こります。"},
  {q:"輸血以外の方法は？",a:"あります。鉄欠乏性貧血は鉄剤で、手術では事前に貧血を整え、術中に止血薬を使い、出た血を回収して戻すこともできます。適した方法は医師に相談を。"},
  {q:"輸血を断れますか？",a:"参加し意見を述べる権利があります。見送りを考えるなら、まず<b>結果と代替策</b>を医療チームと話し合い、安全で希望に合う決定を一緒にしましょう。"},
  {q:"血液はどこから来るの？",a:"善意の無償献血からで、厳重な検査を経て提供されます。血液は限られ貴重なので「必要な時に、十分なだけ」もその思いを大切にすることです。"}],
 ask_h:"赤血球輸血の前に医師へ聞ける3つの質問",ask_sub:"あなたに最も合う決定を一緒に。",
 ask:["今なぜ赤血球が必要なのですか？","先に貧血を治す、または出血を抑える方法はありますか？","必要なら、まず1袋にして再評価できますか？"],
 ask_safe:"<b>大切：</b>数値だけで輸血を求めたり断ったりしないでください。可否は医療チームと評価します。本当に必要な時、迅速な輸血は命を救います。",
 tip_h:"輸血当日の小さな注意",tip:["同意書に署名する前に、分からない点を確認する","輸血前に、氏名・血液型・血液バッグを職員と一緒に照合する","輸血中に不調があれば、すぐナースコールで看護師へ"],

   bad:"발열이나 알레르기가 생길 수 있고, 너무 많고 빠르면 심폐 부담(체액 과다)이 생겨 어르신·심장병 환자는 주의가 필요합니다. 심한 반응은 드뭅니다. 반복 수혈 시 철 과잉이 생길 수 있습니다."},
  {name:"혈소판",ab:"PLT",seven:false,role:"지혈을 돕는 작은 조각",

   when:"혈소판이 매우 낮으면서 출혈이 있을 때, 또는 매우 낮은 상태로 수술·침습적 검사 전. 혈소판 수치로 판단하며 Hb 7 g/dL가 아닙니다.",
   how:"마찬가지로 정맥으로 넣으며 보통 적혈구보다 빠른 약 30분~1시간입니다.",

   bad:"발열·알레르기가 비교적 흔합니다. 실온 보관이라 세균 오염 가능성이 다소 높아 대조 확인과 관찰이 특히 중요합니다."},
  {name:"혈장",ab:"FFP",seven:false,role:"여러 응고 인자를 보충하는 연노랑 액체",

   why:"여러 응고 인자가 부족해 피가 잘 굳지 않고 출혈할 때, 혈장으로 이들을 한 번에 보충합니다.",

 meaning_h:"“7이면 충분”은 무슨 뜻인가요?",meaning_sub:"상태가 안정되고 출혈이 계속되지 않는 대부분의 성인은 헤모글로빈 7 g/dL 이상이면 보통 충분합니다.",
 tile1:"이상이면 보통 충분",tile2u:"봉지",tile2:"먼저 한 봉지, 끝난 뒤 재평가",
 intro:['“7이면 충분”은 기억하기 쉬운 표어입니다. 여기서 <b>7</b>은 <b>헤모글로빈(Hb)</b>, 적혈구에서 산소를 나르는 단백질로 빈혈 정도를 재는 값이며 단위는 <b>g/dL</b>입니다.',
  '뜻은 이렇습니다. 출혈이 계속되지 않는 안정된 대부분의 성인은 Hb를 <b>7 g/dL 이상</b>으로 유지하면 보통 충분하며 반드시 수혈이 필요하지는 않습니다. <b>7 g/dL 아래로</b> 떨어져야 의사가 적혈구 수혈이 필요한지 평가합니다. 국제적으로 ‘제한적 수혈 전략’이라 하며, 안정된 환자는 많이 수혈해도 더 좋지 않고 오히려 위험이 늘기 때문입니다.',
  '기억하세요. 이 <b>7 g/dL는 적혈구의 기준</b>으로 혈소판이나 혈장에는 해당하지 않으며, ‘참고’이지 ‘절대 규칙’이 아닙니다.'],
 postercap:"치메이 의료재단 치메이병원 · PBM(환자 혈액 관리) 추진팀 · 수혈위원회",
 cards:[{h:"7은 참고이지 스위치가 아니다",p:"7 g/dL 미만이라고 반드시 수혈은 아니고, 7 g/dL 초과라고 반드시 금지도 아닙니다. 의료진은 증상·출혈·심장 및 다른 병을 함께 봅니다. 심장·정형 수술이나 심장병이 있으면 7.5나 8 g/dL일 수 있습니다."},
  {h:"한 봉지, 그리고 재평가",p:"안정되고 출혈이 없는 환자는 필요할 때 한 봉지를 원칙으로 하고, 끝난 뒤 증상과 Hb를 보아 정말 필요할 때만 다음 봉지를 넣습니다."},
  {h:"수혈 안 함 ≠ 아무것도 안 함",p:"보류해도 의료진은 빈혈 원인을 찾고 철분을 주며 출혈을 조절하고 병 자체를 치료합니다. 정말 필요하면 즉시 시행합니다."}],
 exc_h:"이 경우는 개별 평가가 필요(기준이 다름)",
 exc:["대량 출혈 중이거나 순환이 불안정","급성 심근경색 · 급성 관동맥증후군(Hb 10 g/dL 미만에서 평가 권고)","장기간 정기 수혈이 필요한 질환","심한 숨참·가슴 답답함 등 뚜렷한 증상"],
 faq_h:"자주 묻는 질문",faq_sub:"눌러서 답을 보세요.",
 faqs:[{q:"“7이면 충분”은 모든 수혈에 해당하나요?",a:"아니요. <b>적혈구에만</b> 해당합니다. 혈소판·혈장·동결침전제제는 각기 다른 기준이며 이 7 g/dL로 판단하지 않습니다."},
  {q:"Hb가 낮은데 의사가 보류하자고 해요. 왜죠?",a:"조금 낮을 뿐 증상도 출혈도 없다면 이득은 제한적이고 위험은 남습니다. 의사는 원인을 찾아 근본적으로 개선하며, 그게 더 안전합니다."},
  {q:"수혈 전에 동의서에 서명하나요? 왜죠?",a:"네. 수혈은 위험이 있는 치료라 의사가 <b>필요한 이유·위험·다른 선택지</b>를 설명하고, 이해한 뒤 수혈 동의서에 서명합니다. 서명 전 궁금한 점은 꼭 확인하세요."},
  {q:"왜 이름과 혈액형을 계속 확인하나요?",a:"<b>피를 잘못 주면 매우 위험</b>하기 때문입니다. 수혈 전 이름·등록번호·혈액형·혈액백을 함께 확인한 뒤 시작합니다. 함께 확인해 주세요. 가장 중요한 안전 단계입니다."},
  {q:"수혈 중 불편하면 어떻게 하나요?",a:"오한·발열·발진·숨참·가슴 답답함·허리 통증 등 불편이 있으면 <b>즉시 호출벨을 누르거나 간호사에게 알리세요</b>. 바로 멈추고 처치합니다."},
  {q:"수혈로 병이 옮나요?",a:"현대의 혈액은 엄격히 검사되어 감염 위험이 <b>매우 낮</b>지만 0은 아닙니다. 불필요한 수혈을 피하면 불필요한 위험을 피합니다."},
  {q:"어떤 위험·부작용이 있나요?",a:"흔한 것은 발열이나 알레르기입니다. 너무 많고 빠르면 체액 과다·호흡곤란이 올 수 있습니다. 심한 반응은 드뭅니다. 철 과잉은 주로 <b>반복 수혈</b>하는 사람에게 생깁니다."},
  {q:"수혈 말고 다른 방법은?",a:"있습니다. 철결핍 빈혈은 철분으로, 수술은 미리 빈혈을 교정하고 수술 중 지혈제를 쓰며 잃은 피를 회수해 되돌릴 수 있습니다. 맞는 방법은 의사와 상의하세요."},
  {q:"수혈을 거부할 수 있나요?",a:"참여하고 의견을 낼 권리가 있습니다. 보류를 고려한다면 먼저 <b>결과와 대안</b>을 의료진과 논의해 안전하고 뜻에 맞는 결정을 함께 하세요."},
  {q:"혈액은 어디서 오나요?",a:"모두 선의의 무상 헌혈에서 오며 엄격한 검사를 거쳐 공급됩니다. 혈액은 한정되고 귀하므로 ‘필요할 때, 충분한 만큼’도 그 마음을 소중히 하는 일입니다."}],
 ask_h:"적혈구 수혈 전 의사에게 물을 세 가지",ask_sub:"당신에게 가장 맞는 결정을 함께.",
 ask:["지금 왜 적혈구가 필요한가요?","먼저 빈혈을 치료하거나 출혈을 조절할 방법이 있나요?","필요하다면 먼저 한 봉지만 하고 재평가할 수 있나요?"],
 ask_safe:"<b>중요:</b> 숫자만 보고 수혈을 요구하거나 거부하지 마세요. 여부는 의료진과 함께 평가합니다. 정말 필요할 때 신속한 수혈은 생명을 구합니다.",
 tip_h:"수혈 당일 작은 알림",tip:["동의서에 서명하기 전, 모르는 점을 확인하세요","수혈 전, 이름·혈액형·혈액백을 직원과 함께 대조하세요","수혈 중 불편하면 즉시 호출벨로 간호사에게 알리세요"],
 disc:"이 페이지는 교육용이며 의사의 진료를 대체하지 않습니다. 응급 시 즉시 진료를 받으세요.<br>치메이 의료재단 치메이병원 · 품질관리부 × Choosing Wisely"},

 whatL:"Là gì",whyL:"Vì sao dùng",whenL:"Khi nào dùng",howL:"Dùng thế nào",goodL:"Lợi ích",badL:"Tác dụng phụ",tag7:"7 là đủ",
 products:[

   bad:"Sốt, dị ứng khá thường gặp; do bảo quản ở nhiệt độ phòng nên nguy cơ nhiễm khuẩn cao hơn một chút, vì vậy đối chiếu và theo dõi rất quan trọng."},

   why:"Khi thiếu nhiều yếu tố đông máu, máu khó đông mà đang chảy máu, huyết tương bù các yếu tố này một lần.",
   when:"Chảy máu kèm rối loạn đông máu, chảy máu do thuốc chống đông, hoặc truyền máu khối lượng lớn. Xét theo xét nghiệm đông máu, không phải Hb 7 g/dL.",
   how:"Rã đông rồi truyền qua tĩnh mạch. Vì lượng lớn nên lưu ý quá tải tim phổi.",
   good:"Bù nhiều yếu tố đông máu, giúp cầm máu.",
   bad:"Dị ứng, sốt; lượng lớn có thể gây thừa dịch, khó thở."},

 meaning_h:"“7 là đủ” nghĩa là gì?",meaning_sub:"Với đa số người lớn ổn định, không chảy máu, huyết sắc tố từ 7 g/dL trở lên thường là đủ.",
 tile1:"trở lên thường là đủ",tile2u:" túi",tile2:"Một túi trước, xong rồi đánh giá lại",
 intro:['“7 là đủ” là khẩu hiệu dễ nhớ. Ở đây <b>7</b> là <b>huyết sắc tố (Hb)</b>, protein mang oxy trong hồng cầu, dùng để đo mức thiếu máu, đơn vị <b>g/dL</b>.',
  'Nghĩa là: với đa số người lớn ổn định, không chảy máu liên tục, giữ Hb <b>từ 7 g/dL trở lên</b> thường là đủ, không nhất thiết phải truyền; chỉ khi <b>dưới 7 g/dL</b> bác sĩ mới bắt đầu đánh giá có cần truyền hồng cầu. Quốc tế gọi là “chiến lược truyền máu hạn chế”, vì nghiên cứu cho thấy với người ổn định, truyền nhiều không tốt hơn mà còn tăng rủi ro.',
  'Hãy nhớ: <b>7 g/dL này là mức tham khảo cho hồng cầu</b>, không áp dụng cho tiểu cầu hay huyết tương; và là “tham khảo”, không phải “quy tắc cứng”.'],
 postercap:"Bệnh viện Chi Mei · Nhóm Quản lý Máu Người bệnh (PBM) · Ủy ban Truyền máu",
 cards:[{h:"7 là tham khảo, không phải công tắc",p:"Dưới 7 g/dL không phải luôn truyền; trên 7 g/dL cũng không phải luôn cấm. Bác sĩ xem triệu chứng, chảy máu, tim và bệnh khác. Với mổ tim, chỉnh hình hay bệnh tim, mức có thể là 7,5 hoặc 8 g/dL."},
  {h:"Một túi rồi đánh giá lại",p:"Với người ổn định không chảy máu, khi cần truyền một túi là nguyên tắc, xong xem triệu chứng và Hb, thật sự cần mới truyền túi kế."},
  {h:"Không truyền không phải không làm gì",p:"Nếu tạm hoãn, nhóm y tế vẫn tìm nguyên nhân thiếu máu, bù sắt, kiểm soát chảy máu và điều trị bệnh. Khi thật sự cần sẽ truyền kịp thời."}],
 exc_h:"Những trường hợp cần đánh giá riêng (tiêu chuẩn khác)",
 exc:["Đang chảy máu nhiều hoặc tuần hoàn không ổn định","Nhồi máu cơ tim cấp / hội chứng vành cấp (hướng dẫn đề nghị đánh giá khi Hb dưới 10 g/dL)","Bệnh cần truyền máu đều đặn lâu dài","Triệu chứng rõ như khó thở nặng, tức ngực"],
 faq_h:"Câu hỏi thường gặp",faq_sub:"Chạm để xem câu trả lời.",
 faqs:[{q:"“7 là đủ” có áp dụng cho mọi loại truyền máu?",a:"Không. <b>Chỉ hồng cầu.</b> Tiểu cầu, huyết tương, tủa lạnh có tiêu chuẩn riêng, không theo 7 g/dL này."},
  {q:"Hb thấp nhưng bác sĩ nói hoãn, vì sao?",a:"Nếu chỉ hơi thấp, không triệu chứng, không chảy máu, lợi ích hạn chế mà rủi ro vẫn còn. Bác sĩ tìm nguyên nhân và điều trị tận gốc, như vậy an toàn hơn."},
  {q:"Trước truyền máu có ký cam kết không? Vì sao?",a:"Có. Truyền máu là điều trị có rủi ro, nên bác sĩ giải thích <b>vì sao cần, rủi ro, và lựa chọn khác</b>, hiểu rồi mới ký giấy đồng ý. Có thắc mắc hãy hỏi rõ trước khi ký."},
  {q:"Vì sao cứ đối chiếu tên và nhóm máu?",a:"Vì <b>truyền nhầm máu rất nguy hiểm</b>. Trước khi truyền, nhân viên cùng bạn đối chiếu tên, số hồ sơ, nhóm máu và túi máu rồi mới bắt đầu. Hãy cùng xác nhận; đây là bước an toàn quan trọng nhất."},
  {q:"Trong lúc truyền thấy khó chịu thì sao?",a:"Nếu ớn lạnh, sốt, nổi mẩn, khó thở, tức ngực, đau lưng hay bất kỳ khó chịu nào, hãy <b>bấm chuông hoặc báo điều dưỡng ngay</b>; sẽ dừng và xử trí lập tức."},
  {q:"Truyền máu có lây bệnh không?",a:"Máu hiện nay được sàng lọc nghiêm ngặt nên nguy cơ nhiễm bệnh <b>rất thấp</b> nhưng không phải bằng không. Tránh truyền không cần thiết là tránh rủi ro không cần thiết."},
  {q:"Có rủi ro hay tác dụng phụ gì?",a:"Thường gặp là sốt hoặc dị ứng. Truyền quá nhiều quá nhanh có thể gây thừa dịch, khó thở. Phản ứng nặng hiếm. Thừa sắt chủ yếu ở người truyền <b>nhiều lần</b>."},
  {q:"Có cách nào thay cho truyền máu?",a:"Có. Thiếu máu do thiếu sắt thì bù sắt; với phẫu thuật có thể cải thiện thiếu máu trước, dùng thuốc giảm chảy máu, và thu hồi máu mất trả lại cho bạn. Hỏi bác sĩ cách nào phù hợp."},
  {q:"Tôi có thể từ chối truyền máu không?",a:"Bạn có quyền tham gia và nêu ý kiến. Nếu cân nhắc không truyền, hãy <b>bàn hậu quả và giải pháp thay thế</b> với nhóm y tế để cùng quyết định an toàn và hợp ý bạn."},
  {q:"Máu từ đâu ra?",a:"Đều từ người hiến máu tình nguyện, được xét nghiệm nghiêm ngặt trước khi cấp. Máu có hạn và quý, nên ‘cần mới truyền, đủ là được’ cũng là trân trọng tấm lòng đó."}],
 ask_h:"Ba câu hỏi trước khi truyền hồng cầu",ask_sub:"Cùng quyết định điều tốt nhất cho bạn.",
 ask:["Vì sao bây giờ tôi cần hồng cầu?","Có cách trị thiếu máu hoặc kiểm soát chảy máu trước không?","Nếu cần, truyền một túi trước rồi đánh giá lại được không?"],
 ask_safe:"<b>Quan trọng:</b> Đừng yêu cầu hay từ chối truyền máu chỉ dựa vào con số. Việc có truyền hay không nên đánh giá cùng nhóm y tế. Khi thật sự cần, truyền kịp thời cứu mạng.",
 tip_h:"Nhắc nhở trong ngày truyền máu",tip:["Trước khi ký giấy đồng ý, hỏi rõ những điều chưa hiểu","Trước khi truyền, cùng nhân viên đối chiếu tên, nhóm máu và túi máu","Trong lúc truyền nếu khó chịu, bấm chuông báo điều dưỡng ngay"],
 disc:"Trang này mang tính giáo dục, không thay thế khám chữa bệnh. Khi khẩn cấp hãy đi khám ngay.<br>Bệnh viện Chi Mei · Quản lý Chất lượng × Choosing Wisely"},

 products:[
  {name:"Sel darah merah",ab:"RBC",seven:true,role:"Sel terbanyak dalam darah, membawa oksigen ke seluruh tubuh",
   what:"Sel darah merah adalah sel terbanyak dalam darah; hemoglobin (Hb) di dalamnya menangkap oksigen dan membawanya dari paru ke seluruh tubuh. Darah donor dipisah dan dipekatkan menjadi satu kantong, disebut sel darah merah pekat (RBC).",

   why:"Bila trombosit terlalu sedikit atau kurang berfungsi, mudah memar dan perdarahan sulit berhenti, parahnya berdarah sendiri. Transfusi mengembalikan kemampuan menghentikan perdarahan.",

 meaning_h:"Apa arti “7 sudah cukup”?",meaning_sub:"Bagi kebanyakan orang dewasa yang stabil dan tidak berdarah, hemoglobin 7 g/dL atau lebih biasanya sudah cukup.",
 tile1:"atau lebih biasanya cukup",tile2u:" kantong",tile2:"Satu kantong dulu, lalu nilai ulang",
 intro:['“7 sudah cukup” adalah slogan yang mudah diingat. Di sini <b>7</b> berarti <b>hemoglobin (Hb)</b>, protein pembawa oksigen dalam sel darah merah, dipakai untuk menilai anemia, dengan satuan <b>g/dL</b>.',
  'Artinya: bagi kebanyakan pasien dewasa yang stabil dan tidak terus berdarah, menjaga Hb <b>7 g/dL atau lebih</b> biasanya sudah cukup dan tidak selalu perlu transfusi; baru saat <b>di bawah 7 g/dL</b> dokter mulai menilai perlu tidaknya sel darah merah. Secara internasional ini disebut “strategi transfusi restriktif”, karena penelitian menunjukkan bagi pasien stabil, transfusi lebih banyak tidak lebih baik dan menambah risiko.',
  'Ingat: <b>7 g/dL ini acuan untuk sel darah merah</b>, tidak berlaku untuk trombosit atau plasma; dan ini “acuan”, bukan “aturan mutlak”.'],
 postercap:"Rumah Sakit Chi Mei · Tim Manajemen Darah Pasien (PBM) · Komite Transfusi",
 cards:[{h:"7 itu acuan, bukan sakelar",p:"Di bawah 7 g/dL tak selalu harus transfusi; di atas 7 g/dL juga tak selalu dilarang. Tim menimbang gejala, perdarahan, jantung dan penyakit lain. Untuk operasi jantung/ortopedi atau penyakit jantung, ambangnya bisa 7,5 atau 8 g/dL."},
  {h:"Satu kantong, lalu nilai ulang",p:"Untuk pasien stabil tanpa perdarahan, bila perlu beri satu kantong, lalu cek gejala dan Hb, beri lagi hanya bila benar-benar perlu."},
  {h:"Tidak transfusi bukan berarti diam saja",p:"Bila ditunda, tim tetap mencari penyebab anemia, memberi zat besi, mengendalikan perdarahan, dan mengobati penyakitnya. Bila benar-benar perlu, diberikan segera."}],
 exc_h:"Kondisi ini perlu penilaian tersendiri (standar berbeda)",
 exc:["Sedang perdarahan banyak atau sirkulasi tidak stabil","Infark miokard akut / sindrom koroner akut (pedoman menyarankan dinilai bila Hb di bawah 10 g/dL)","Penyakit yang perlu transfusi rutin jangka panjang","Gejala jelas seperti sesak berat atau nyeri dada"],
 faq_h:"Pertanyaan umum",faq_sub:"Ketuk untuk melihat jawaban.",
 faqs:[{q:"Apakah “7 sudah cukup” berlaku untuk semua transfusi?",a:"Tidak. <b>Hanya sel darah merah.</b> Trombosit, plasma, kriopresipitat punya standar sendiri, bukan 7 g/dL ini."},
  {q:"Hb rendah tapi dokter bilang ditunda, kenapa?",a:"Bila hanya sedikit rendah, tanpa gejala dan tanpa perdarahan, manfaatnya terbatas sedangkan risiko tetap ada. Dokter mencari penyebab dan mengobatinya lebih mendasar, itu lebih aman."},
  {q:"Apakah tanda tangan persetujuan sebelum transfusi? Mengapa?",a:"Ya. Transfusi adalah pengobatan berisiko, jadi dokter menjelaskan <b>alasan, risiko, dan pilihan lain</b>, lalu Anda menandatangani persetujuan transfusi. Tanyakan yang belum jelas sebelum menandatangani."},
  {q:"Mengapa nama dan golongan darah dicocokkan berulang?",a:"Karena <b>salah memberi darah sangat berbahaya</b>. Sebelum transfusi, petugas bersama Anda mencocokkan nama, nomor rekam medis, golongan darah, dan kantong darah. Mohon ikut memastikan; ini langkah keselamatan terpenting."},
  {q:"Bagaimana bila merasa tidak enak saat transfusi?",a:"Bila menggigil, demam, ruam, sesak, nyeri dada, nyeri pinggang atau tidak nyaman, <b>segera tekan bel atau beri tahu perawat</b>; akan dihentikan dan ditangani segera."},
  {q:"Apakah transfusi bisa menular penyakit?",a:"Darah kini disaring ketat sehingga risiko infeksi <b>sangat rendah</b> tetapi bukan nol. Menghindari transfusi yang tak perlu menghindari risiko yang tak perlu."},
  {q:"Apa risiko atau efek sampingnya?",a:"Yang lebih umum demam atau alergi. Terlalu banyak dan cepat bisa menyebabkan kelebihan cairan dan sesak. Reaksi berat jarang. Kelebihan zat besi terutama pada yang ditransfusi <b>berulang kali</b>."},
  {q:"Adakah alternatif selain transfusi?",a:"Ada. Anemia kekurangan zat besi diberi zat besi; untuk operasi, anemia bisa diperbaiki dulu, obat mengurangi perdarahan, dan darah yang hilang bisa didaur ulang untuk Anda. Tanyakan mana yang cocok."},
  {q:"Bolehkah saya menolak transfusi?",a:"Anda berhak ikut serta dan menyampaikan pendapat. Bila mempertimbangkan menolak, <b>bahas dulu akibat dan alternatifnya</b> dengan tim untuk memutuskan bersama yang aman dan sesuai keinginan Anda."},
  {q:"Dari mana darah berasal?",a:"Semua dari pendonor sukarela, disaring ketat sebelum diberikan. Darah terbatas dan berharga, maka ‘transfusi hanya bila perlu, secukupnya’ juga menghargai ketulusan itu."}],
 ask_h:"Tiga pertanyaan sebelum transfusi sel darah merah",ask_sub:"Bersama memutuskan yang terbaik untuk Anda.",
 ask:["Kenapa saya perlu sel darah merah sekarang?","Adakah cara mengobati anemia atau mengendalikan perdarahan dulu?","Bila perlu, bisakah satu kantong dulu lalu dinilai ulang?"],
 ask_safe:"<b>Penting:</b> Jangan meminta atau menolak transfusi hanya berdasarkan angka. Perlu tidaknya dinilai bersama tim medis. Saat benar-benar perlu, transfusi tepat waktu menyelamatkan nyawa.",
 tip_h:"Pengingat di hari transfusi",tip:["Sebelum menandatangani persetujuan, tanyakan yang belum dimengerti","Sebelum transfusi, cocokkan nama, golongan darah, dan kantong darah bersama petugas","Bila tidak nyaman saat transfusi, segera tekan bel dan beri tahu perawat"],

   how:"ให้ทางหลอดเลือดดำเช่นกัน มักเร็วกว่าเม็ดเลือดแดง ประมาณ 30 นาที–1 ชั่วโมง",

   when:"มีเลือดออกร่วมกับการแข็งตัวผิดปกติ เลือดออกจากยาต้านการแข็งตัว หรือการให้เลือดปริมาณมาก พิจารณาจากผลตรวจการแข็งตัว ไม่ใช่ Hb 7 g/dL",

 meaning_h:"“แค่ 7 ก็พอ” หมายความว่าอย่างไร?",meaning_sub:"ผู้ใหญ่ส่วนใหญ่ที่อาการคงที่และไม่มีเลือดออก ค่าฮีโมโกลบิน 7 g/dL ขึ้นไปมักเพียงพอ",
 tile1:"ขึ้นไปมักเพียงพอ",tile2u:" ถุง",tile2:"หนึ่งถุงก่อน แล้วประเมินซ้ำ",
 intro:['“แค่ 7 ก็พอ” เป็นสโลแกนที่จำง่าย ตรงนี้ <b>7</b> หมายถึง <b>ฮีโมโกลบิน (Hb)</b> โปรตีนนำออกซิเจนในเม็ดเลือดแดง ใช้วัดระดับโลหิตจาง หน่วยคือ <b>g/dL</b>',
  'ความหมายคือ สำหรับผู้ป่วยผู้ใหญ่ส่วนใหญ่ที่อาการคงที่และไม่มีเลือดออกต่อเนื่อง การรักษา Hb <b>ตั้งแต่ 7 g/dL ขึ้นไป</b> มักเพียงพอ ไม่จำเป็นต้องให้เลือดเสมอ ต่อเมื่อ <b>ต่ำกว่า 7 g/dL</b> แพทย์จึงเริ่มประเมินว่าจำเป็นต้องให้เม็ดเลือดแดงหรือไม่ ในระดับสากลเรียกว่า “กลยุทธ์การให้เลือดแบบจำกัด” เพราะงานวิจัยพบว่าในผู้ป่วยที่คงที่ การให้มากไม่ได้ดีกว่าแต่กลับเพิ่มความเสี่ยง',
  'โปรดจำไว้ว่า <b>7 g/dL นี้เป็นค่าอ้างอิงของเม็ดเลือดแดง</b> ไม่ใช้กับเกล็ดเลือดหรือพลาสมา และเป็น “ค่าอ้างอิง” ไม่ใช่ “กฎตายตัว”'],
 postercap:"โรงพยาบาล Chi Mei · ทีมบริหารการใช้เลือดผู้ป่วย (PBM) · คณะกรรมการการให้เลือด",
 cards:[{h:"7 เป็นค่าอ้างอิง ไม่ใช่สวิตช์",p:"ต่ำกว่า 7 g/dL ไม่จำเป็นต้องให้เสมอ สูงกว่า 7 g/dL ก็ไม่ใช่ว่าห้ามให้ ทีมแพทย์ดูอาการ การมีเลือดออก โรคหัวใจและโรคอื่นร่วมด้วย ผู้ที่ผ่าตัดหัวใจ/กระดูกหรือมีโรคหัวใจ เกณฑ์อาจเป็น 7.5 หรือ 8 g/dL"},
  {h:"หนึ่งถุงแล้วประเมินซ้ำ",p:"สำหรับผู้ป่วยที่คงที่และไม่มีเลือดออก เมื่อจำเป็นให้ทีละหนึ่งถุง แล้วดูอาการและ Hb จะให้ถุงต่อไปเมื่อจำเป็นจริง"},
  {h:"ไม่ให้เลือด ไม่ได้แปลว่าไม่ทำอะไร",p:"หากยังไม่ให้ ทีมแพทย์ยังหาสาเหตุโลหิตจาง ให้ธาตุเหล็ก ควบคุมเลือดออก และรักษาโรคต้นเหตุ เมื่อจำเป็นจริงจะให้ทันเวลา"}],
 exc_h:"กรณีเหล่านี้ต้องประเมินเป็นรายบุคคล (เกณฑ์ต่างกัน)",
 exc:["กำลังเสียเลือดมากหรือระบบไหลเวียนไม่คงที่","กล้ามเนื้อหัวใจตายเฉียบพลัน / กลุ่มอาการหลอดเลือดหัวใจเฉียบพลัน (แนวทางแนะนำให้ประเมินเมื่อ Hb ต่ำกว่า 10 g/dL)","โรคที่ต้องรับเลือดสม่ำเสมอในระยะยาว","มีอาการชัดเจน เช่น เหนื่อยมาก แน่นหน้าอก"],
 faq_h:"คำถามที่พบบ่อย",faq_sub:"แตะเพื่อดูคำตอบ",
 faqs:[{q:"“แค่ 7 ก็พอ” ใช้กับการให้เลือดทุกชนิดไหม?",a:"ไม่ <b>ใช้กับเม็ดเลือดแดงเท่านั้น</b> เกล็ดเลือด พลาสมา ไครโอมีเกณฑ์ของตัวเอง ไม่ใช้ 7 g/dL นี้"},
  {q:"Hb ต่ำ แต่หมอบอกยังไม่ให้ ทำไม?",a:"หากต่ำเพียงเล็กน้อย ไม่มีอาการ ไม่มีเลือดออก ประโยชน์จำกัดแต่ความเสี่ยงยังอยู่ แพทย์จะหาสาเหตุและรักษาที่ต้นเหตุ ซึ่งปลอดภัยกว่า"},
  {q:"ก่อนให้เลือดต้องเซ็นใบยินยอมไหม? ทำไม?",a:"ต้องเซ็น การให้เลือดเป็นการรักษาที่มีความเสี่ยง แพทย์จะอธิบาย <b>เหตุผล ความเสี่ยง และทางเลือกอื่น</b> เมื่อเข้าใจแล้วจึงเซ็นใบยินยอม หากสงสัยให้ถามให้ชัดก่อนเซ็น"},
  {q:"ทำไมต้องตรวจสอบชื่อและหมู่เลือดซ้ำ ๆ?",a:"เพราะ <b>การให้เลือดผิดอันตรายมาก</b> ก่อนให้เลือด เจ้าหน้าที่จะตรวจสอบชื่อ เลขเวชระเบียน หมู่เลือด และถุงเลือดร่วมกับคุณก่อนเริ่ม โปรดช่วยยืนยันด้วย นี่คือด่านความปลอดภัยที่สำคัญที่สุด"},
  {q:"ระหว่างให้เลือดรู้สึกไม่สบายทำอย่างไร?",a:"หากหนาวสั่น มีไข้ ผื่น เหนื่อย แน่นหน้าอก ปวดหลัง หรือไม่สบายใด ๆ <b>กดกริ่งหรือบอกพยาบาลทันที</b> จะหยุดและดูแลทันที"},
  {q:"การให้เลือดทำให้ติดโรคไหม?",a:"เลือดปัจจุบันผ่านการตรวจคัดกรองเข้มงวด ความเสี่ยงติดเชื้อจึง <b>ต่ำมาก</b> แต่ไม่ใช่ศูนย์ การเลี่ยงการให้เลือดที่ไม่จำเป็นคือการเลี่ยงความเสี่ยงที่ไม่จำเป็น"},
  {q:"มีความเสี่ยงหรือผลข้างเคียงอะไร?",a:"ที่พบบ่อยคือไข้หรือแพ้ ให้มากและเร็วเกินไปอาจเกิดน้ำเกินและหายใจลำบาก ปฏิกิริยารุนแรงพบน้อย ธาตุเหล็กเกินมักเกิดกับผู้ที่รับเลือด <b>ซ้ำหลายครั้ง</b>"},
  {q:"มีทางเลือกอื่นนอกจากการให้เลือดไหม?",a:"มี โลหิตจางจากขาดธาตุเหล็กให้ธาตุเหล็กได้ การผ่าตัดสามารถแก้ภาวะโลหิตจางล่วงหน้า ใช้ยาลดเลือดออก และนำเลือดที่เสียกลับคืนสู่ตัวคุณ ปรึกษาแพทย์ว่าแบบใดเหมาะกับคุณ"},
  {q:"ฉันปฏิเสธการให้เลือดได้ไหม?",a:"คุณมีสิทธิ์มีส่วนร่วมและแสดงความเห็น หากคิดจะไม่รับ โปรด <b>ปรึกษาผลที่ตามมาและทางเลือก</b> กับทีมแพทย์ก่อน เพื่อตัดสินใจร่วมกันอย่างปลอดภัยและตรงความต้องการ"},
  {q:"เลือดมาจากไหน?",a:"มาจากผู้บริจาคด้วยความสมัครใจ ผ่านการตรวจอย่างเข้มงวดก่อนนำมาใช้ เลือดมีจำกัดและมีค่า ‘ให้เมื่อจำเป็น พอเพียงก็พอ’ จึงเป็นการเห็นคุณค่าน้ำใจนั้นด้วย"}],
 ask_h:"สามคำถามก่อนรับเม็ดเลือดแดง",ask_sub:"ร่วมกันตัดสินใจสิ่งที่เหมาะกับคุณที่สุด",

};

var RID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'r'+Date.now()+Math.random().toString(36).slice(2,8);
var PREANS=null;
function record(phase,ans){
  var z=QZ[lang];
  var ok=(ans===z.correct);
  var payload={response_id:RID,source:"orbs",ts:new Date().toISOString(),instrument:"orbs_pre",mode:"pre",
    phase:"前測",lang:lang,pre_answer:(ans===null?"skip":ans),pre_correct:(ans===null?"":(ok?1:0))};
  try{ if(ENDPOINT){fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});}else{console.log("[record]",payload);} }catch(e){}
}
function renderExtras(){
  var e=EX[lang];
  set('thr_h',e.thr.title);set('thr_sub',e.thr.sub);set('thr_note',e.thr.note);
  document.getElementById('thr_body').innerHTML=e.thr.rows.map(function(r){return '<div class="thr-row"><span class="thr-c">'+r[0]+'</span><span class="thr-v">'+r[1]+'</span></div>';}).join('');
  set('alts_h',e.alts.title);set('alts_sub',e.alts.sub);set('alts_note',e.alts.note);
  document.getElementById('alts_body').innerHTML=e.alts.items.map(function(a){return '<div class="altc"><div class="ai">'+a.ic+'</div><div><div class="an">'+a.name+'</div><div class="ad">'+a.desc+'</div></div></div>';}).join('');
  set('gift_h',e.precious.title);set('gift_sub',e.precious.sub);set('gift_close',e.precious.close);
  document.getElementById('gift_body').innerHTML=e.precious.items.map(function(g){return '<div class="giftc"><div class="gb">'+g.big+'</div><div class="gl">'+g.lab+'</div></div>';}).join('');
  set('cta_h',e.cta.h);set('cta_sub',e.cta.sub);
  var btn=document.getElementById('cta_btn');btn.textContent=e.cta.btn;
  var preOk=(PREANS===null)?"":((QZ[lang]&&PREANS===QZ[lang].correct)?1:0);
  btn.href=GAME_URL+"?src=orbs&rid="+encodeURIComponent(RID)+"&lang="+encodeURIComponent(lang)
    +"&pre="+encodeURIComponent(PREANS===null?"skip":PREANS)+"&pre_ok="+encodeURIComponent(preOk);
  btn.onclick=function(){ record("to_game",PREANS); };
}
function renderQuiz(){
  var z=QZ[lang];
  set('pt_intro',z.pre_intro);document.getElementById('pt_note').style.display='none';set('pt_q',z.q);set('pt_skip',z.skip);set('pt_thanks',z.thanks_pre);set('pt_enter',z.enter);
  document.getElementById('pt_opts').innerHTML=z.opts.map(function(o,i){return '<button class="opt" onclick="choosePre('+i+')">'+o+'</button>';}).join('');
}
function choosePre(i){ if(PREANS!=null)return; PREANS=i; record("pre",i);
  document.getElementById('pt_body').style.display='none';
  document.getElementById('pt_done').style.display='block'; }
function skipPre(){ if(PREANS==null)record("pre",null); closePre(); }
function closePre(){ document.getElementById('pretest').style.display='none'; }
function buildPreBar(){ var lb=document.getElementById('pt_langbar');
  LANGS.forEach(function(p){ var b=document.createElement('button'); b.innerHTML=p[1];
    if(p[0]===lang)b.className='on'; b.onclick=function(){setLang(p[0]);}; lb.appendChild(b); }); }
function syncBars(){
  var mb=document.getElementById('langbar').querySelectorAll('button');
  var pb=document.getElementById('pt_langbar').querySelectorAll('button');
  LANGS.forEach(function(p,i){ if(mb[i])mb[i].classList.toggle('on',p[0]===lang); if(pb[i])pb[i].classList.toggle('on',p[0]===lang); });
}
function setLang(l){ lang=l; renderAll(); renderQuiz(); syncBars(); }

buildLangBar();buildPreBar();renderAll();renderQuiz();
</script>
</body>
</html>
